<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Cockpit de direction de site MECARIA : qualité, métrologie, production, flux, SAV et amélioration continue, fondé sur des preuves.">
<meta name="theme-color" content="#16252B">
<title>MECARIA · Cockpit de direction de site</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=B612:ital,wght@0,400;0,700;1,400&family=B612+Mono:wght@400;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8ECE9;--sheet:#F7F9F7;--field:#FFFFFF;--ink:#16252B;--muted:#55636A;--line:#BCC7C3;--hair:#D7DEDB;
  --rail:#16252B;--rail-2:#22353C;--rail-ink:#CFDAD7;--rail-muted:#8A9B9E;
  --pri:#1E4B73;--pri-ink:#FFFFFF;--pri-soft:#DCE7F1;
  --red:#A3302A;--red-bg:#F6E3E0;--amb:#855609;--amb-bg:#F4EAD4;--grn:#2B6B45;--grn-bg:#DFEDE3;--neu:#44545B;--neu-bg:#E3E9EB;
  --focus:#1E4B73;--r:3px;
  --f-ui:"B612","Segoe UI",system-ui,sans-serif;--f-mono:"B612 Mono",ui-monospace,Consolas,monospace;--f-disp:"Barlow Condensed","Arial Narrow",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10171A;--sheet:#172125;--field:#0E1518;--ink:#E2E9E6;--muted:#9AA9A6;--line:#34454A;--hair:#26343A;
  --rail:#0B1113;--rail-2:#1A2A30;--rail-ink:#C9D5D2;--rail-muted:#7D8F93;
  --pri:#7DAEDD;--pri-ink:#0B1520;--pri-soft:#1D3347;
  --red:#EC8A80;--red-bg:#3A1F1D;--amb:#E0AE55;--amb-bg:#352A15;--grn:#7CC596;--grn-bg:#18301F;--neu:#B3C0C4;--neu-bg:#223036;
  --focus:#9CC4EA;color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#10171A;--sheet:#172125;--field:#0E1518;--ink:#E2E9E6;--muted:#9AA9A6;--line:#34454A;--hair:#26343A;
  --rail:#0B1113;--rail-2:#1A2A30;--rail-ink:#C9D5D2;--rail-muted:#7D8F93;
  --pri:#7DAEDD;--pri-ink:#0B1520;--pri-soft:#1D3347;
  --red:#EC8A80;--red-bg:#3A1F1D;--amb:#E0AE55;--amb-bg:#352A15;--grn:#7CC596;--grn-bg:#18301F;--neu:#B3C0C4;--neu-bg:#223036;
  --focus:#9CC4EA;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-ui);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}

/* Structure */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100dvh}
.rail{position:sticky;top:0;height:100dvh;overflow-y:auto;background:var(--rail);color:var(--rail-ink);padding:18px 12px calc(18px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));display:flex;flex-direction:column;gap:18px;z-index:30}
.brand{display:flex;gap:11px;align-items:center;padding:2px 8px 6px}
.brand svg{flex:none}
.brand b{display:block;font:700 22px/1 var(--f-disp);letter-spacing:.06em;color:#fff}
.brand small{color:var(--rail-muted);font-size:12px}
.navg h3{font:600 14px/1 var(--f-disp);letter-spacing:.03em;color:var(--rail-muted);margin:0 10px 6px}
#nav{display:grid;gap:14px}
.nav{display:grid;gap:1px}
.nav button{appearance:none;border:0;background:transparent;display:flex;gap:10px;align-items:center;width:100%;padding:8px 10px;border-radius:var(--r);cursor:pointer;color:var(--rail-ink);font-size:14px;text-align:left;min-height:38px}
.nav button:hover{background:var(--rail-2)}
.nav button[aria-current="page"]{background:var(--rail-2);color:#fff;box-shadow:inset 3px 0 0 #7FB2E0}
.nav .ic{width:18px;text-align:center;flex:none;opacity:.85}
.nav .n{margin-left:auto;font:700 11px/1 var(--f-mono);padding:3px 6px;border-radius:2px;background:#8E2E28;color:#fff}
.nav .n.a{background:#7A5412}
.rule{margin-top:auto;border:1px solid #2F454C;padding:11px 12px;font-size:12.5px;color:var(--rail-ink)}
.rule b{display:block;color:#fff;margin-bottom:3px}
.rtools{display:none;flex-direction:column;gap:8px;border-top:1px solid #2F454C;padding:12px 4px 0}
.rtools label{font-size:12.5px;color:var(--rail-muted)}
.rtools select{background:var(--rail-2);color:#fff;border-color:#2F454C}
.rtools .btn.q{background:transparent;color:#fff;border-color:#4A6168}
.store{font-size:12px;color:var(--rail-muted);padding:0 4px}
.store.warn{color:#E8B35B}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px clamp(14px,3vw,36px);padding-top:calc(10px + env(safe-area-inset-top));background:var(--sheet);border-bottom:1px solid var(--line)}
.top .menu{display:none}
#view:focus{outline:none}
.search{position:relative;flex:1 1 260px;max-width:460px}
.search input{width:100%}
.top select{min-width:0}
.top .sp{flex:1}
.content{width:100%;max-width:1480px;margin:0 auto;padding:24px clamp(14px,3vw,36px) calc(40px + env(safe-area-inset-bottom))}

/* Cartouche (title block) */
.cart{display:grid;grid-template-columns:minmax(0,1fr) minmax(130px,190px) minmax(130px,190px);border:1.5px solid var(--ink);background:var(--sheet);margin-bottom:12px}
.cart>div{padding:7px 12px;border-left:1px solid var(--ink);border-top:1px solid var(--ink);min-width:0}
.cart>.ct{grid-row:1/3;border-left:0;border-top:0;display:flex;flex-direction:column;justify-content:center;padding:12px 16px}
.cart>div:nth-child(2),.cart>div:nth-child(3){border-top:0}
.cart small{display:block;font-size:11.5px;color:var(--muted)}
.cart span{font:400 13px/1.3 var(--f-mono);overflow-wrap:anywhere}
.cart h1{margin:0;font:700 clamp(30px,4vw,46px)/.95 var(--f-disp);letter-spacing:.01em}
.cart .grp{font-size:12.5px;color:var(--muted);margin-bottom:4px}
.intro{max-width:78ch;color:var(--muted);margin:0 0 22px}

/* Relevé de mesures (KPI) */
.releve{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));background:var(--sheet);border:1px solid var(--line);margin-bottom:20px}
.releve>div{position:relative;padding:13px 16px 14px 18px;border-right:1px solid var(--hair);border-bottom:1px solid var(--hair);min-width:0}
.releve>div::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--hair)}
.releve .t-bad::before{background:var(--red)}.releve .t-warn::before{background:var(--amb)}.releve .t-ok::before{background:var(--grn)}
.releve .l{font-size:13px;font-weight:700}
.releve .v{font:700 38px/1 var(--f-disp);margin:6px 0 4px;font-variant-numeric:tabular-nums}
.releve .v small{font-size:20px;margin-left:2px}
.releve .v.vs{font-size:25px;overflow-wrap:anywhere}
.releve .h{font-size:12px;color:var(--muted)}
.releve .s{font-size:11.5px;color:var(--muted);margin-top:6px;border-top:1px dashed var(--hair);padding-top:5px}

/* Panels */
.cols{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:18px;align-items:start}
.cols.eq{grid-template-columns:repeat(2,minmax(0,1fr))}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);margin-bottom:18px;min-width:0}
.ph{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:flex-start;padding:13px 16px;border-bottom:1px solid var(--hair)}
.ph h2{font:600 22px/1.05 var(--f-disp);margin:0}
.ph p{margin:3px 0 0;color:var(--muted);font-size:13px;max-width:70ch}
.pa{display:flex;flex-wrap:wrap;gap:6px}
.pb{padding:14px 16px}
.note{border:1px solid var(--line);border-left:4px solid var(--amb);background:var(--sheet);padding:10px 14px;margin:0 0 18px;font-size:13.5px;max-width:110ch}
.note.info{border-left-color:var(--pri)}
.note b{margin-right:4px}
.empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:13.5px}
.empty b{display:block;color:var(--ink);margin-bottom:3px}
.empty .btn{margin-top:12px}

/* Tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;position:relative}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:12px;font-weight:700;color:var(--muted);text-align:left;padding:9px 12px;border-bottom:1.5px solid var(--ink);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--hair);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr.row{cursor:pointer}
tbody tr.row:hover{background:var(--pri-soft)}
td.acts{white-space:nowrap;text-align:right;width:1%}
.ref{font:400 12.5px var(--f-mono)}
.nil{color:var(--muted)}
.late{color:var(--red);font-weight:700}
.late small{font-weight:400;margin-left:4px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.meter{display:flex;align-items:center;gap:8px;min-width:120px}
.meter i{flex:1;height:6px;background:var(--hair);position:relative;min-width:60px}
.meter i b{position:absolute;inset:0 auto 0 0;background:var(--pri)}
.meter i b.t-bad{background:var(--red)}.meter i b.t-warn{background:var(--amb)}

/* Tags as feature-control frames */
.frame{display:inline-flex;align-items:stretch;border:1px solid currentColor;border-radius:2px;font-size:12px;font-weight:700;line-height:1.15;white-space:nowrap;color:var(--neu);background:var(--neu-bg)}
.frame i{font-style:normal;display:grid;place-items:center;min-width:19px;border-right:1px solid currentColor;font-size:11px}
.frame span{padding:3px 7px}
.t-bad.frame{color:var(--red);background:var(--red-bg)}
.t-warn.frame{color:var(--amb);background:var(--amb-bg)}
.t-ok.frame{color:var(--grn);background:var(--grn-bg)}
.t-info.frame{color:var(--pri);background:var(--pri-soft)}

/* Buttons & fields */
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--pri);background:var(--pri);color:var(--pri-ink);font-weight:700;font-size:14px;padding:7px 13px;border-radius:var(--r);cursor:pointer;min-height:38px;white-space:nowrap;text-decoration:none}
.btn:hover{filter:brightness(1.08)}
.btn.q{background:var(--sheet);color:var(--ink);border-color:var(--line)}
.btn.q:hover{border-color:var(--ink);filter:none}
.btn.s{min-height:30px;padding:3px 9px;font-size:12.5px}
.btn.del{color:var(--red)}
.btn:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{background:var(--field);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;font-size:16px;min-height:40px;max-width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--pri)}
textarea{min-height:84px;resize:vertical;width:100%}
.ro [data-write]{display:none!important}

/* Dialogs */
dialog{border:1.5px solid var(--ink);border-radius:var(--r);padding:0;width:min(680px,calc(100vw - 20px));max-height:calc(100dvh - 20px);background:var(--sheet);color:var(--ink)}
dialog::backdrop{background:rgb(16 26 30 / .5)}
dialog[open]{animation:dlg .16s ease-out}
@keyframes dlg{from{opacity:0;transform:translateY(8px)}}
.dh{padding:14px 18px;border-bottom:1px solid var(--hair)}
.dh h2{margin:0;font:600 25px/1.05 var(--f-disp)}
.dh p{margin:4px 0 0;color:var(--muted);font-size:13px}
.db{padding:16px 18px;overflow-y:auto;max-height:calc(100dvh - 190px)}
.df{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;padding:12px 18px;border-top:1px solid var(--hair)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.fgrid label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700;min-width:0}
.fgrid label.wide{grid-column:1/-1}
.fgrid input,.fgrid select{width:100%}
.fgrid .req{color:var(--red)}
.meta{grid-column:1/-1;font-size:12px;color:var(--muted);border-top:1px dashed var(--hair);padding-top:8px}

/* Lists */
.list{margin:0;padding:0;list-style:none}
.list li{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:11px 16px;border-bottom:1px solid var(--hair)}
.list li:last-child{border-bottom:0}
.list .lt{min-width:0}
.list .lt b{display:block;overflow-wrap:anywhere}
.list .lt small{color:var(--muted)}
.list .la{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;border:1px solid var(--line);background:var(--field);border-radius:2px;padding:5px 9px;cursor:pointer;font-size:12.5px;text-align:left}
.chip:hover{border-color:var(--pri)}
.chip .ref{font-weight:700;margin-right:6px}

/* Definition grids (référentiels) */
.defs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:0;border-top:1px solid var(--hair)}
.defs>div{padding:12px 16px;border-bottom:1px solid var(--hair);border-right:1px solid var(--hair)}
.defs b{display:block;font-size:14px}
.defs p{margin:3px 0 0;color:var(--muted);font-size:13px}
details.panel>summary{cursor:pointer;list-style:none;padding:13px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px}
details.panel>summary>h2{grid-column:1;grid-row:1}
details.panel>summary>p{grid-column:1;grid-row:2}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary h2{display:inline;font:600 22px/1.05 var(--f-disp)}
details.panel>summary::after{content:"Afficher";grid-column:2;grid-row:1;align-self:center;font-size:12.5px;color:var(--pri);font-weight:700;border:1px solid var(--line);padding:4px 9px;border-radius:var(--r)}
details.panel[open]>summary::after{content:"Masquer"}
details.panel>summary p{margin:3px 0 0;color:var(--muted);font-size:13px}

/* DMAIC sequence */
.seq{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));counter-reset:s;border:1px solid var(--line);background:var(--sheet);margin-bottom:18px}
.seq>div{padding:12px 14px;border-right:1px solid var(--hair);position:relative}
.seq>div:last-child{border-right:0}
.seq b{font:700 22px/1 var(--f-disp);display:block}
.seq b::before{counter-increment:s;content:counter(s) " ";color:var(--muted);font-weight:500}
.seq p{margin:4px 0 0;font-size:12.5px;color:var(--muted)}
.seq .c{font:700 12px var(--f-mono);position:absolute;top:10px;right:12px;color:var(--pri)}

/* Review */
.inputs{margin:0;padding:0;list-style:none;counter-reset:in}
.inputs li{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;padding:11px 16px;border-bottom:1px solid var(--hair);align-items:start}
.inputs li:last-child{border-bottom:0}
.inputs li::before{counter-increment:in;content:counter(in, lower-alpha) ")";font:700 18px/1.1 var(--f-disp);color:var(--muted)}
.inputs b{display:block}
.inputs small{color:var(--muted);display:block}
.ai-out{white-space:pre-wrap;font-size:14px;line-height:1.55;border:1px dashed var(--line);padding:12px 14px;background:var(--field);min-height:60px}

/* Search results, toast, scrim */
.sr-box{position:absolute;top:calc(100% + 6px);left:0;width:min(560px,calc(100vw - 28px));max-height:65vh;overflow:auto;background:var(--sheet);border:1.5px solid var(--ink);border-radius:var(--r);z-index:40;box-shadow:0 18px 40px rgb(0 0 0 / .18)}
.sr-box[hidden]{display:none}
.sr-box button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--hair);background:transparent;padding:9px 12px;cursor:pointer}
.sr-box button:hover,.sr-box button:focus-visible{background:var(--pri-soft)}
.sr-box small{display:block;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translate(-50%,16px);background:var(--ink);color:var(--sheet);padding:10px 16px;border-radius:var(--r);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:calc(100vw - 30px);font-size:14px}
.toast.show{opacity:1;transform:translate(-50%,0)}
.scrim{display:none}
.foot{color:var(--muted);font-size:12px;margin-top:10px;max-width:110ch}
svg.pareto{width:100%;height:auto;display:block}
.pareto .bar{fill:var(--pri)}
.pareto .cum{fill:none;stroke:var(--red);stroke-width:2}
.pareto .dot{fill:var(--red)}
.pareto .ax{stroke:var(--ink);stroke-width:1}
.pareto .g80{stroke:var(--amb);stroke-dasharray:4 4}
.pareto text{fill:var(--ink);font:11px var(--f-ui)}
.pareto .mu{fill:var(--muted)}

.airun{padding:14px 16px;border-bottom:1px solid var(--hair)}
.airun:last-child{border-bottom:0}
.airun header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.airun p{margin:6px 0;max-width:95ch}
.airun .list li{padding:10px 0}
.airun .lt small{display:block;margin-top:2px}
.list .lt small b{display:inline}
.airun>p.nil{font-size:13px}
pre.json{max-height:280px;overflow:auto;font:12px/1.45 var(--f-mono);background:var(--field);border:1px solid var(--line);padding:10px;white-space:pre-wrap;word-break:break-word}
ul.plain{margin:0 0 12px;padding-left:18px}
ul.plain li{margin:3px 0}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.fgrid label.chk{flex-direction:row;font-weight:400}
.chkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px 16px}
input[type=checkbox]{min-height:0;width:20px;height:20px;padding:0;accent-color:var(--pri);flex:none}
details>summary{cursor:pointer;color:var(--pri);font-weight:700;font-size:13.5px}
details.panel>summary{color:var(--ink);font-weight:400;font-size:inherit}
.chip.on{border-color:var(--pri);background:var(--pri-soft);font-weight:700}
.h3{font:600 19px/1.1 var(--f-disp);margin:4px 0 8px}
svg.chart{width:100%;min-width:520px;height:auto;display:block;margin-bottom:10px}
svg.chart.radar{min-width:0;max-width:380px}
svg.chart.fish{min-width:720px}
.chart text{fill:var(--ink);font:11px var(--f-ui)}
.chart .mu{fill:var(--muted)}
.chart .ttl{font-weight:700;font-size:12px}
.chart .ax{stroke:var(--ink)}
.chart .gr{stroke:var(--hair);fill:none}
.chart .lim{stroke:var(--red);stroke-dasharray:6 4}
.chart .cl{stroke:var(--grn);stroke-width:1.2}
.chart .ser{fill:none;stroke:var(--pri);stroke-width:1.6}
.chart .pt{fill:var(--pri)}
.chart .pt.bad{fill:var(--red)}
.chart .bar{fill:var(--pri);opacity:.78}
.chart .cum{fill:none;stroke:var(--red);stroke-width:2}
.chart .tol{stroke:var(--red);stroke-width:2}
.chart .nom{stroke:var(--grn);stroke-dasharray:4 3}
.chart .g80{stroke:var(--amb);stroke-dasharray:4 4}
.chart .cur{fill:var(--pri);fill-opacity:.22;stroke:var(--pri);stroke-width:2}
.chart .prev{fill:none;stroke:var(--muted);stroke-dasharray:5 4;stroke-width:1.5}
.pareto .bar.vital{fill:var(--ink)}
.pareto text{font-size:10.5px}
.fish .spine{stroke:var(--ink);stroke-width:3;fill:none}
.fish .boneL{stroke:var(--ink);stroke-width:1.6}
.fish .tick{stroke:var(--line)}
.fish .catb{fill:var(--pri-soft);stroke:var(--pri)}
.fish .cat{font-weight:700;font-size:12px;fill:var(--pri)}
.fish .cz{font-size:10.5px}
.fish .keep{font-size:10.5px;font-weight:700;fill:var(--red)}
.fish .head{fill:var(--red-bg);stroke:var(--red);stroke-width:1.5}
.fish .eff{font-weight:700;font-size:13px}
.whys{margin:0;padding:0;list-style:none;counter-reset:w}
.whys li{counter-increment:w;position:relative;padding:8px 10px 8px 46px;border:1px solid var(--hair);background:var(--field);margin-bottom:6px}
.whys li::before{content:"P" counter(w);position:absolute;left:10px;top:8px;font:700 13px var(--f-mono);color:var(--pri)}
.whys li+li{margin-left:10px}
.whys li+li+li{margin-left:20px}
.whys li+li+li+li{margin-left:30px}
.whys li+li+li+li+li{margin-left:40px;border-color:var(--red)}
.dl{margin:0}
.dl dt{font-weight:700;font-size:13px;margin-top:8px}
.dl dd{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
table.grid td{padding:3px}
table.grid th.c{text-align:center}
input.cell{width:88px;min-height:34px;padding:4px 6px;font:14px var(--f-mono);text-align:right}
input.cell.bad{border-color:var(--red);background:var(--red-bg)}

table.strat tfoot td,table.strat tfoot th{border-top:1.5px solid var(--ink)}
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.bcol{background:var(--bg);border:1px solid var(--hair);padding:8px;min-width:0}
.bcol h3{font:600 17px/1.1 var(--f-disp);margin:2px 2px 8px;display:flex;justify-content:space-between;gap:6px}
.card{background:var(--sheet);border:1px solid var(--line);padding:8px;margin-bottom:8px}
.card b{display:block;font-size:13.5px;overflow-wrap:anywhere}
.card small{display:block;color:var(--muted);margin:3px 0 6px}
.radar-wrap{display:flex;justify-content:center}
.defs p .btn{margin-top:6px}
@media (max-width:1100px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){.board{grid-template-columns:minmax(0,1fr)}}
@media (max-width:1100px){.cols,.cols.eq{grid-template-columns:minmax(0,1fr)}.seq{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;inset:0 auto 0 0;width:min(290px,86vw);transform:translateX(-102%);transition:transform .22s ease;box-shadow:12px 0 40px rgb(0 0 0 / .3)}
  .rail.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgb(16 26 30 / .45);z-index:25}
  .top .menu{display:inline-flex}
  .search{flex:1 1 0;max-width:none}
  .top .top-only{display:none}
  .rtools{display:flex}
  .top{flex-wrap:nowrap}
  .top .sp{display:none}
  .cart{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cart>.ct{grid-row:auto;grid-column:1/-1}
  .cart>div{border-top:1px solid var(--ink)}
  .cart>div:nth-child(2n){border-left:0}
  .cart>.ct{border-top:0}
  .seq{grid-template-columns:minmax(0,1fr)}
  .seq>div{border-right:0;border-bottom:1px solid var(--hair)}
  .fgrid{grid-template-columns:minmax(0,1fr)}
  .releve{grid-template-columns:repeat(2,minmax(0,1fr))}
  .releve .v{font-size:32px}
  .inputs li{grid-template-columns:26px minmax(0,1fr)}
  .inputs li>.frame{grid-column:2;justify-self:start}
  .list li{flex-direction:column}
  .list .la{justify-content:flex-start}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media print{
  .rail,.top,.scrim,.toast,[data-write],.noprint,.btn{display:none!important}
  .app{display:block}body{background:#fff}
  .panel,.releve,.cart{break-inside:avoid;border-color:#999}
  .content{padding:0;max-width:none}
}

function aiDefaults(){return {status:'Désactivée',decision:null,history:[],agents:Object.fromEntries(AGENTS.map(a=>[a,true])),providers:[{id:'mistral',on:true,model:PROV.mistral.def},{id:'groq',on:false,model:PROV.groq.def},{id:'cerebras',on:false,model:PROV.cerebras.def},{id:'claude',on:false,model:''}],data:{colls:Object.fromEntries(AI_COLLS.map(c=>[c,true])),pseudo:true,freeText:true,sendConfidential:false,max:60},user:''}}
function aiDecision(o){return o&&typeof o==='object'?{status:AI_STATUS.includes(o.status)?o.status:'Désactivée',by:str(o.by,120),fn:str(o.fn,120),date:isISO(o.date)?o.date:'',ref:str(o.ref,120),review:isISO(o.review)?o.review:'',scope:str(o.scope,2000),ack:!!o.ack,at:str(o.at,40)}:null}
function mergeAI(s){
  const d=aiDefaults();if(!s||typeof s!=='object')return d;
  if(AI_STATUS.includes(s.status))d.status=s.status;
  d.decision=aiDecision(s.decision);
  if(Array.isArray(s.history))d.history=s.history.map(aiDecision).filter(Boolean).slice(-50);
  if(s.agents&&typeof s.agents==='object')AGENTS.forEach(a=>{if(typeof s.agents[a]==='boolean')d.agents[a]=s.agents[a]});
  if(Array.isArray(s.providers)){
    const out=[];
    s.providers.forEach(p=>{if(p&&PROV[p.id]&&!out.some(x=>x.id===p.id))out.push({id:p.id,on:!!p.on,model:str(p.model,80)||(p.id==='claude'?'':PROV[p.id].def)})});
    d.providers.forEach(p=>{if(!out.some(x=>x.id===p.id))out.push(p)});
    d.providers=out;
  }
  if(s.data&&typeof s.data==='object'){
    if(s.data.colls&&typeof s.data.colls==='object')AI_COLLS.forEach(c=>{d.data.colls[c]=typeof s.data.colls[c]==='boolean'?s.data.colls[c]:false});
    ['pseudo','freeText','sendConfidential'].forEach(k=>{if(typeof s.data[k]==='boolean')d.data[k]=s.data[k]});
    const m=parseNum(s.data.max);if(m)d.data.max=Math.min(200,Math.max(5,Math.round(m)));
  }
  d.user=str(s.user,120);
  if(d.status!=='Désactivée'&&!d.decision)d.status='Désactivée';
  return d;
}

const Store={mode:'mémoire',idb:null,mem:{},
  async init(){try{if(!('indexedDB' in window))throw 0;this.idb=await new Promise((res,rej)=>{const q=indexedDB.open('mecaria-cockpit',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);q.onblocked=()=>rej(new Error('blocked'))});this.mode='IndexedDB'}catch{this.idb=null;this.mode='mémoire'}},
  get(k){if(!this.idb)return Promise.resolve(this.mem[k]);return new Promise((res,rej)=>{const r=this.idb.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  set(k,v){this.mem[k]=v;if(!this.idb)return Promise.resolve();return new Promise((res,rej)=>{const tx=this.idb.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)})}
};

function normalize(src){
  const d=blank();if(!src||typeof src!=='object'||Array.isArray(src))throw new Error('Le fichier ne contient pas un objet JSON.');
  let n=0;
  for(const c of COLLS){if(Array.isArray(src[c])){d[c]=src[c].filter(o=>o&&typeof o==='object'&&!Array.isArray(o)).map(cleanRec);n+=d[c].length}}
  // Compatibilité avec la version précédente (mecaria-real-v1)
  d.nc.forEach(x=>{if(x.cause&&!x.rootCause)x.rootCause=x.cause});
  d.machines.forEach(x=>{if(x.load==null&&x.capacity){const p=String(x.capacity).match(/(\d+(?:[.,]\d+)?)\s*%/);if(p)x.load=parseNum(p[1])}});
  d.methods.forEach(x=>{x.planned=parseNum(x.planned);x.actual=parseNum(x.actual)});
  d.deals.forEach(x=>{x.revenue=parseNum(x.revenue);x.cost=parseNum(x.cost)});
  d.customers.forEach(x=>{x.revenue=parseNum(x.revenue)});
  if(Array.isArray(src.shipments))d.shipments.forEach(x=>{if(!x.shipped&&x.onTime!==undefined)x.legacyOnTime=String(x.onTime)});
  if(Array.isArray(src.auditLog))d.auditLog=src.auditLog.filter(e=>e&&typeof e==='object').map(e=>({at:String(e.at||''),role:String(e.role||''),action:String(e.action||''),coll:String(e.coll||e.entity||''),id:String(e.id||''),label:String(e.label||''),detail:typeof e.detail==='string'?e.detail:JSON.stringify(e.payload||'').slice(0,240)})).slice(-2000);
  if(src.approvals&&typeof src.approvals==='object')for(const [k,v] of Object.entries(src.approvals))if(v&&typeof v==='object')d.approvals[k]={at:String(v.at||'')};
  if(src.meta&&typeof src.meta==='object'&&typeof src.meta.role==='string')d.meta.role=src.meta.role;
  if(src.meta?.targets&&typeof src.meta.targets==='object')for(const k of Object.keys(TARGET_DEF)){const v=parseNum(src.meta.targets[k]);if(v!==null&&v>=0)d.meta.targets[k]=v}
  if(typeof src.meta?.scatter==='string')d.meta.scatter=src.meta.scatter.slice(0,20000);
  d.ai=mergeAI(src.ai);
  if(Array.isArray(src.aiRuns))d.aiRuns=src.aiRuns.filter(o=>o&&typeof o==='object').map(sanitizeRun).slice(-200);
  d._count=n;return d;
}

function isOpen(c,r){
  if(OPEN_EXTRA[c])return OPEN_EXTRA[c](r);
  if(c==='actions'||c==='nc')return !String(r.status||'').startsWith('Close');
  if(c==='complaints')return r.stage!=='D8 Clôture';
  if(c==='supply')return r.status!=='Réceptionné';
  if(c==='compliance')return r.status==='Écart ouvert';
  return true;
}
const isLate=(c,r,k='due')=>isOpen(c,r)&&isISO(r[k])&&daysFromToday(r[k])<0;
function calInfo(r){
  if(['Hors service','Réformé'].includes(r.state))return {next:null,label:r.state,t:'bad'};
  if(r.state==='En réparation')return {next:null,label:'En réparation',t:'warn'};
  const p=parseNum(r.period);
  if(!isISO(r.lastCal)||!p)return {next:null,label:'À renseigner',t:'warn'};
  const next=addMonths(r.lastCal,Math.round(p)),d=daysFromToday(next);
  if(d<0)return {next,label:'Échu',t:'bad',d};
  if(d<=30)return {next,label:'À planifier',t:'warn',d};
  return {next,label:'Conforme',t:'ok',d};
}
const marginOf=r=>{const a=parseNum(r.revenue),b=parseNum(r.cost);return a&&b!==null?(a-b)/a*100:null};
const arcOf=r=>isISO(r.orderDate)&&isISO(r.arcDate)?daysBetween(r.orderDate,r.arcDate):null;
function otdOf(r){if(!isISO(r.promised))return null;if(isISO(r.shipped))return daysBetween(r.promised,r.shipped)<=0?{label:'À l’heure',t:'ok'}:{label:`En retard (${daysBetween(r.promised,r.shipped)} j)`,t:'bad'};return daysFromToday(r.promised)<0?{label:'Non expédiée, en retard',t:'bad'}:{label:'À venir',t:'neu'}}
const gapOf=r=>{const p=parseNum(r.planned),a=parseNum(r.actual);return p&&a!==null?(a-p)/p*100:null};

const DER={
  _next:r=>{const i=calInfo(r);return i.next?`<span class="${i.t==='bad'?'late':''}">${fmtDate(i.next)}${i.t==='bad'?'<small>dépassée</small>':''}</span>`:'<span class="nil">—</span>'},
  _cal:r=>{const i=calInfo(r);return tag(i.label,i.t)+(i.t==='warn'&&i.d!=null?` <small class="nil">${i.d} j</small>`:'')},
  _load:r=>{const v=parseNum(r.load);if(v===null)return '<span class="nil">—</span>';const t=v>=95?'t-bad':v>=85?'t-warn':'';return `<span class="meter"><i><b class="${t}" style="width:${Math.min(v,100)}%"></b></i><span class="num">${fmtNum(v)} %</span></span>`},
  _gap:r=>{const g=gapOf(r);if(g===null)return '<span class="nil">—</span>';return tag((g>0?'+':'')+fmtNum(g,1)+' %',g>15?'bad':g>5?'warn':'ok')},
  _margin:r=>{const m=marginOf(r);if(m===null)return tag('Coût ou CA manquant','warn');return tag(fmtNum(m,1)+' %',m<15?'bad':m<25?'warn':'ok')},
  _arc:r=>{const a=arcOf(r);if(a===null)return '<span class="nil">—</span>';return tag(a+' j',a>2?'bad':'ok')},
  _otd:r=>{const o=otdOf(r);return o?tag(o.label,o.t):'<span class="nil">—</span>'},
  _cert:r=>r.certificate?tag('Certificat référencé','ok'):tag(r.status==='Réceptionné'?'Reçu sans certificat':'Certificat attendu',r.status==='Réceptionné'?'bad':'warn'),
  _test:r=>r.lastTest?`<span class="num">${esc(fmtStamp(r.lastTest))}</span>${r.lastError?`<br><small class="late">${esc(r.lastError)}</small>`:''}`:'<span class="nil">Jamais testé</span>',
};
const colSpec=(c,x)=>typeof x==='string'?{k:x,l:field(c,x)?.l||x}:x;
function cellHTML(c,col,r){
  if(DER[col.k])return DER[col.k](r);
  const f=field(c,col.k),v=r[col.k];
  if(v===null||v===undefined||v==='')return '<span class="nil">—</span>';
  if(f?.type==='date'){const late=col.k==='due'&&isLate(c,r);return `<span class="num${late?' late':''}">${esc(fmtDate(v))}${late?'<small>en retard</small>':''}</span>`}
  if(f?.type==='select')return tag(v);
  if(f?.type==='number')return `<span class="num">${esc(fmtNum(parseNum(v),2))}</span>`;
  if(f?.mono||col.mono)return `<span class="ref">${esc(v)}</span>`;
  const s=String(v);return esc(s.length>110?s.slice(0,107)+'…':s);
}

/* ───────── Agents (règles déterministes) ───────── */
function analyse(){
  const out=[],add=(rule,ids,agent,prio,finding,action,ref='')=>out.push({key:rule+':'+hash(ids.join('|')),agent,prio,finding,action,ref});
  const names=(arr,k)=>arr.slice(0,4).map(r=>r[k]||r.ref||'?').join(', ')+(arr.length>4?'…':'');
  // Qualité
  if(!db.compliance.length)add('q-matrix',['0'],'Qualité','Haute','Aucune exigence normative n’est enregistrée.','Construire la matrice exigences / preuves et confirmer le périmètre ISO 9001 / EN 9100 avec le certificat en vigueur.');
  const gaps=db.compliance.filter(r=>r.status==='Écart ouvert');
  if(gaps.length)add('q-gaps',gaps.map(r=>r.id),'Qualité','Haute',`${plural(gaps.length,'écart normatif ouvert','écarts normatifs ouverts')} : ${names(gaps,'clause')}.`,'Relier chaque écart à une action corrective avec responsable, échéance et vérification d’efficacité.');
  const ncO=db.nc.filter(r=>isOpen('nc',r));
  const noCause=ncO.filter(r=>!r.rootCause&&isISO(r.detected)&&daysFromToday(r.detected)<=-7);
  if(noCause.length)add('q-cause',noCause.map(r=>r.id),'Qualité','Haute',`${plural(noCause.length,'NC ouverte')} depuis plus de 7 jours sans cause racine.`,'Conduire l’analyse (5 pourquoi, Ishikawa 6M) et documenter la cause racine avant de choisir l’action.',noCause[0].ref||'');
  const ncLate=ncO.filter(r=>isLate('nc',r));
  if(ncLate.length)add('q-late',ncLate.map(r=>r.id),'Qualité','Haute',`${plural(ncLate.length,'NC')} dont l’échéance est dépassée : ${names(ncLate,'title')}.`,'Relancer le responsable ou replanifier en revue avec justification.');
  const toVerify=db.nc.filter(r=>r.status==='Close – efficacité à vérifier');
  if(toVerify.length)add('q-verify',toVerify.map(r=>r.id),'Qualité','Moyenne',`${plural(toVerify.length,'NC')} close${toVerify.length>1?'s':''} sans vérification d’efficacité.`,'Vérifier sur données (récurrence, contrôle) puis passer en « Close – efficace ».');
  // Métrologie
  if(!db.instruments.length)add('m-none',['0'],'Métrologie','Haute','Aucun moyen de mesure n’est inventorié.','Inventorier les instruments avec identification, périodicité, dernier étalonnage et certificat (ISO 9001 § 7.1.5).');
  const due=db.instruments.filter(r=>calInfo(r).label==='Échu');
  if(due.length)add('m-due',due.map(r=>r.id),'Métrologie','Haute',`${plural(due.length,'instrument échu','instruments échus')} : ${names(due,'code')}.`,'Retirer de l’usage et étalonner. Si l’instrument est trouvé non conforme, évaluer l’impact sur les mesures réalisées depuis le dernier étalonnage valide.');
  const soon=db.instruments.filter(r=>calInfo(r).label==='À planifier');
  if(soon.length)add('m-soon',soon.map(r=>r.id),'Métrologie','Moyenne',`${plural(soon.length,'instrument')} à étalonner sous 30 jours : ${names(soon,'code')}.`,'Planifier l’envoi ou la vérification interne et prévoir un moyen de remplacement.');
  const unk=db.instruments.filter(r=>calInfo(r).label==='À renseigner');
  if(unk.length)add('m-unk',unk.map(r=>r.id),'Métrologie','Moyenne',`${plural(unk.length,'instrument')} sans date d’étalonnage ou périodicité.`,'Compléter la fiche à partir du dernier certificat ou constat de vérification.');
  // Production
  if(!db.machines.length)add('p-none',['0'],'Production','Haute','Aucun inventaire machine n’est saisi.','Renseigner le parc réel : état, charge, maintenance et contraintes par équipement.');
  const down=db.machines.filter(r=>['Panne','Arrêt'].includes(r.status));
  if(down.length)add('p-down',down.map(r=>r.id+r.status),'Production','Haute',`${plural(down.length,'machine')} à l’arrêt : ${names(down,'name')}.`,'Qualifier l’impact planning, prévenir les clients concernés et sécuriser un plan de continuité.',down[0].ref||'');
  const over=db.machines.filter(r=>(parseNum(r.load)??0)>=95);
  if(over.length)add('p-over',over.map(r=>r.id),'Production','Moyenne',`${plural(over.length,'machine')} saturée${over.length>1?'s':''} (≥ 95 %) : ${names(over,'name')}.`,'Arbitrer la charge : décalage, heures supplémentaires, report sur machine équivalente ou sous-traitance qualifiée.');
  // Industrialisation
  const inProd=db.deals.filter(r=>r.status==='En production');
  const notValid=inProd.filter(d=>db.industrial.some(i=>i.ref===d.ref&&i.stage!=='Validé série'));
  if(notValid.length)add('i-valid',notValid.map(r=>r.id),'Industrialisation','Haute',`Production lancée sans validation série : ${names(notValid,'ref')}.`,'Bloquer ou encadrer par dérogation écrite ; finaliser FAI et validation du dossier.',notValid[0].ref);
  const noDossier=inProd.filter(d=>d.ref&&!db.industrial.some(i=>i.ref===d.ref));
  if(noDossier.length)add('i-none',noDossier.map(r=>r.id),'Industrialisation','Moyenne',`${plural(noDossier.length,'affaire')} en production sans dossier d’industrialisation : ${names(noDossier,'ref')}.`,'Ouvrir le dossier (revue de contrat, risques, gamme, FAI) ou justifier une pièce reconduite.',noDossier[0].ref);
  // Méthodes
  const drift=db.methods.filter(r=>(gapOf(r)??0)>15);
  if(drift.length)add('me-gap',drift.map(r=>r.id),'Méthodes','Moyenne',`${plural(drift.length,'opération')} dépasse${drift.length>1?'nt':''} le temps prévu de plus de 15 % : ${names(drift,'ref')}.`,'Analyser l’écart (réglage, outil, matière, programme) et mettre à jour la gamme ou le chiffrage.',drift[0].ref);
  // Commercial
  const live=db.deals.filter(r=>r.status!=='Perdu');
  const noCost=live.filter(r=>marginOf(r)===null);
  if(noCost.length)add('c-cost',noCost.map(r=>r.id),'Commercial','Moyenne',`${plural(noCost.length,'affaire')} sans CA ou coût complet : ${names(noCost,'ref')}.`,'Compléter le chiffrage : temps, matière, sous-traitance et coût de non-qualité.');
  const low=live.filter(r=>{const m=marginOf(r);return m!==null&&m<15});
  if(low.length)add('c-low',low.map(r=>r.id),'Commercial','Haute',`${plural(low.length,'affaire')} sous 15 % de marge : ${names(low,'ref')}.`,'Revoir le prix ou la gamme avant d’accepter de nouvelles commandes similaires (seuil de 15 % à ajuster).',low[0].ref);
  const arc=db.deals.filter(r=>(arcOf(r)??0)>2);
  if(arc.length)add('c-arc',arc.map(r=>r.id),'Commercial','Moyenne',`Engagement ARC 48 h non tenu sur ${plural(arc.length,'affaire')} : ${names(arc,'ref')}.`,'Identifier le goulet (revue de contrat, disponibilité, validation technique) et fixer un circuit d’ARC.');
  if(!db.customers.length)add('c-cust',['0'],'Commercial','Moyenne','Aucun client n’est référencé.','Importer les clients actifs et qualifier secteur, CA, exigences et risque.');
  const cr=db.customers.map(r=>parseNum(r.revenue)||0),tot=cr.reduce((a,b)=>a+b,0);
  if(tot>0){const i=cr.indexOf(Math.max(...cr));const share=cr[i]/tot*100;if(share>30)add('c-dep',[db.customers[i].id,String(Math.round(share))],'Commercial','Moyenne',`Dépendance : ${db.customers[i].customer} représente ${fmtNum(share)} % du CA connu.`,'Définir un plan de diversification sectorielle et suivre la part du premier client en revue.')}
  // Flux
  const noCert=db.supply.filter(r=>r.status==='Réceptionné'&&!r.certificate);
  if(noCert.length)add('f-cert',noCert.map(r=>r.id),'Flux et SAV','Haute',`${plural(noCert.length,'réception')} sans certificat de traçabilité : ${names(noCert,'item')}.`,'Bloquer la libération des pièces concernées et obtenir le certificat matière ou traitement.',noCert[0].ref||'');
  const blk=db.supply.filter(r=>r.status==='Bloqué');
  if(blk.length)add('f-blk',blk.map(r=>r.id),'Flux et SAV','Haute',`${plural(blk.length,'approvisionnement bloqué','approvisionnements bloqués')} : ${names(blk,'item')}.`,'Traiter avec le fournisseur et mesurer l’impact sur les affaires liées.',blk[0].ref||'');
  const lateS=db.supply.filter(r=>isLate('supply',r,'need'));
  if(lateS.length)add('f-late',lateS.map(r=>r.id),'Flux et SAV','Haute',`${plural(lateS.length,'besoin')} non réceptionné${lateS.length>1?'s':''} après la date prévue : ${names(lateS,'item')}.`,'Relancer le fournisseur et replanifier les OF dépendants.',lateS[0].ref||'');
  const lateShip=db.shipments.filter(r=>!isISO(r.shipped)&&isISO(r.promised)&&daysFromToday(r.promised)<0);
  if(lateShip.length)add('f-ship',lateShip.map(r=>r.id),'Flux et SAV','Haute',`${plural(lateShip.length,'expédition')} en retard non partie${lateShip.length>1?'s':''} : ${names(lateShip,'ref')}.`,'Informer le client avec une nouvelle date fiable et traiter la cause du retard.',lateShip[0].ref);
  const crit=db.complaints.filter(r=>isOpen('complaints',r)&&r.severity==='Critique');
  if(crit.length)add('s-crit',crit.map(r=>r.id),'Flux et SAV','Haute',`${plural(crit.length,'réclamation critique ouverte','réclamations critiques ouvertes')} : ${names(crit,'customer')}.`,'Confinement sous 24 h (stock, en-cours, chez le client), information client, 8D et point en revue de direction.',crit[0].ref||'');
  const early=['D0 Préparation','D1 Équipe','D2 Description','D3 Confinement'];
  const slow=db.complaints.filter(r=>isOpen('complaints',r)&&isISO(r.date)&&daysFromToday(r.date)<=-10&&(!r.stage||early.includes(r.stage)));
  if(slow.length)add('s-slow',slow.map(r=>r.id),'Flux et SAV','Moyenne',`${plural(slow.length,'réclamation')} de plus de 10 jours sans cause racine établie.`,'Accélérer le 8D jusqu’en D4 et tenir le client informé.');
  // Black Belt
  const counts={};db.nc.forEach(r=>{const k=r.cause5m||'À analyser';if(k!=='À analyser')counts[k]=(counts[k]||0)+1});
  const top=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];
  if(top&&top[1]>=3&&!db.projects.some(p=>isOpen('projects',p)&&p.stage!=='Control'))add('b-pareto',[top[0],String(top[1])],'Black Belt','Moyenne',`Famille « ${top[0]} » : ${top[1]} NC, en tête du Pareto, sans projet d’amélioration actif.`,'Ouvrir un projet DMAIC ciblé sur cette famille de causes avec baseline et objectif chiffré.');
  const openP=db.projects.filter(r=>r.stage&&r.stage!=='Control');
  const noBase=openP.filter(r=>!r.baseline||!r.target);
  if(noBase.length)add('b-base',noBase.map(r=>r.id),'Black Belt','Moyenne',`${plural(noBase.length,'projet')} sans baseline ou objectif chiffré.`,'Mesurer la situation de départ avant toute solution (phase Measure).');
  analyseImprove(add,names);
  // Actions
  const aLate=db.actions.filter(r=>isLate('actions',r));
  if(aLate.length)add('a-late',aLate.map(r=>r.id),'Direction','Haute',`${plural(aLate.length,'action')} en retard : ${names(aLate,'title')}.`,'Arbitrer en revue : relance, nouvelle échéance justifiée ou escalade.');
  if(!out.length)add('ok',['0'],'Direction','Basse','Aucune alerte sur les données saisies.','Maintenir la revue hebdomadaire et vérifier chaque indicateur avec sa source.');
  const rank={Haute:0,Moyenne:1,Basse:2};
  return out.sort((a,b)=>rank[a.prio]-rank[b.prio]);
}

function paretoHTML(){
  const counts={};db.nc.forEach(r=>{const k=r.cause5m||'À analyser';counts[k]=(counts[k]||0)+1});
  const e=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  if(!e.length)return `<div class="empty"><b>Pas encore de Pareto</b>Le diagramme se construit à partir des non-conformités classées par famille 6M.</div>`;
  const W=600,H=240,pl=36,pr=40,pt=18,pb=48,iw=W-pl-pr,ih=H-pt-pb,bw=iw/e.length,max=e[0][1],tot=e.reduce((s,x)=>s+x[1],0);
  let cum=0;const pts=[];
  const bars=e.map(([k,v],i)=>{const h=ih*v/max,x=pl+i*bw,cx=x+bw/2;cum+=v;const cy=pt+ih-ih*cum/tot;pts.push(`${cx.toFixed(1)},${cy.toFixed(1)}`);return `<rect class="bar" x="${(x+bw*.18).toFixed(1)}" y="${(pt+ih-h).toFixed(1)}" width="${(bw*.64).toFixed(1)}" height="${h.toFixed(1)}"><title>${esc(k)} : ${v}</title></rect><text x="${cx.toFixed(1)}" y="${(pt+ih-h-5).toFixed(1)}" text-anchor="middle">${v}</text><text class="mu" x="${cx.toFixed(1)}" y="${H-pb+16}" text-anchor="middle">${esc(k.length>13?k.slice(0,12)+'…':k)}</text><circle class="dot" cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="3"/>`}).join('');
  const y80=pt+ih-ih*.8;
  return `<div class="pb"><svg class="pareto" viewBox="0 0 ${W} ${H}" role="img" aria-label="Pareto des non-conformités par famille de cause : ${e.map(([k,v])=>esc(k)+' '+v).join(', ')}"><line class="ax" x1="${pl}" y1="${pt+ih}" x2="${W-pr}" y2="${pt+ih}"/><line class="ax" x1="${pl}" y1="${pt}" x2="${pl}" y2="${pt+ih}"/><line class="ax" x1="${W-pr}" y1="${pt}" x2="${W-pr}" y2="${pt+ih}"/><line class="g80" x1="${pl}" y1="${y80}" x2="${W-pr}" y2="${y80}"/><text class="mu" x="${W-pr+4}" y="${y80+4}">80 %</text><text class="mu" x="${W-pr+4}" y="${pt+4}">100 %</text><text class="mu" x="${pl-6}" y="${pt+4}" text-anchor="end">${max}</text><text class="mu" x="${pl-6}" y="${pt+ih}" text-anchor="end">0</text>${bars}<polyline class="cum" points="${pts.join(' ')}"/><text class="mu" x="${pl}" y="${H-6}">${plural(tot,'non-conformité')} · barres : effectif · courbe : cumul en %</text></svg></div>`;
}

function vDashboard(){
  const open=db.actions.filter(r=>isOpen('actions',r)).sort((a,b)=>(isLate('actions',b)-isLate('actions',a))||(['Haute','Normale','Basse'].indexOf(a.priority)-['Haute','Normale','Basse'].indexOf(b.priority))||String(a.due||'9').localeCompare(String(b.due||'9')));
  const decision=open.length?`<ul class="list">${open.slice(0,12).map(r=>{const late=isLate('actions',r);return `<li><div class="lt"><b>${esc(r.title)}</b><small>${r.ref?`<span class="ref">${esc(r.ref)}</span>, `:''}${esc(r.owner||'Responsable à désigner')}, échéance <span class="${late?'late':''}">${esc(fmtDate(r.due)||'à définir')}${late?' (en retard)':''}</span></small></div><div class="la">${tag(r.priority||'À qualifier')}<button class="btn q s" data-act="close-action" data-id="${esc(r.id)}" data-write>Clore</button><button class="btn q s" data-act="edit" data-coll="actions" data-id="${esc(r.id)}">Ouvrir</button></div></li>`}).join('')}</ul>${open.length>12?`<div class="pb nil">+ ${open.length-12} autres actions ouvertes, voir le registre ci-dessous.</div>`:''}`:emptyHTML('actions','Aucune action ouverte. Crée une action ou transforme une recommandation d’agent en action.');
  const f=analyse(),high=f.filter(x=>x.prio==='Haute'&&!db.approvals[x.key]);
  const k=kpis(),by=l=>k.find(x=>x.l===l);
  const lines=[
    ['Sécurité et risques majeurs',db.machines.filter(r=>['Panne','Arrêt'].includes(r.status)).length+db.instruments.filter(r=>calInfo(r).label==='Échu').length,'machine(s) à l’arrêt ou instrument(s) échu(s)',db.machines.length+db.instruments.length],
    ['Client, conformité et SAV',db.nc.filter(r=>isOpen('nc',r)).length+db.complaints.filter(r=>isOpen('complaints',r)).length+db.compliance.filter(r=>r.status==='Écart ouvert').length,'NC, réclamation(s) ou écart(s) ouverts',db.nc.length+db.complaints.length+db.compliance.length],
    ['Production, charge et délais',db.machines.filter(r=>(parseNum(r.load)??0)>=95).length+db.supply.filter(r=>isLate('supply',r,'need')).length+db.shipments.filter(r=>otdOf(r)?.t==='bad').length,'saturation(s) ou retard(s)',db.machines.length+db.supply.length+db.shipments.length],
    ['Marge, cash et décisions',db.deals.filter(r=>r.status!=='Perdu'&&((marginOf(r)??0)<15)).length,'affaire(s) sous 15 % ou non chiffrée(s)',db.deals.length],
  ];
  const agenda=`<ul class="list">${lines.map(([t,n,u,base])=>`<li><div class="lt"><b>${esc(t)}</b><small>${base?(n?`${n} ${esc(u)}`:'Aucun signal sur les données saisies'):'Aucune donnée saisie'}</small></div><div class="la">${base?tag(n?plural(n,'point'):'RAS',n?'bad':'ok'):tag('À renseigner','warn')}</div></li>`).join('')}</ul><div class="pb"><button class="btn q" data-act="nav" data-view="review">Préparer la revue de direction</button></div>`;
  const refs=allRefs(),linked=Object.entries(refs).filter(([,s])=>s.size>1);
  const chains=linked.length?`<div class="pb chips">${linked.slice(0,30).map(([r,s])=>`<button class="chip" data-act="trace" data-ref="${esc(r)}"><span class="ref">${esc(r)}</span>${esc([...s].map(c=>COLL_LABEL[c]).join(' + '))}</button>`).join('')}</div>`:`<div class="empty"><b>Aucune chaîne</b>Saisis la même référence d’affaire dans plusieurs modules pour relier devis, production, qualité et SAV.</div>`;
  return releveHTML(k)
  +(high.length?`<p class="note"><b>${plural(high.length,'alerte prioritaire')}</b>${esc(high[0].finding)} <button class="btn q s" data-act="nav" data-view="agents">Voir les agents</button></p>`:'')
  +`<div class="cols"><div>${panel({title:'Centre de décision',sub:'Actions ouvertes, les retards et les priorités hautes en premier.',body:decision,acts:btnNew('actions','Action')})}</div><div>${panel({title:'Comité de direction',sub:'Ordre du jour calculé sur les fiches.',body:agenda})}${panel({title:'Chaînes interconnectées',sub:'Références présentes dans plusieurs modules.',body:chains})}</div></div>`
  +panel({title:'Registre des actions',sub:'Une action est close quand sa preuve d’efficacité est vérifiée.',coll:'actions',body:tableHTML('actions')})
  +`<details class="panel"><summary><h2>Référentiel documentaire du groupe</h2><p>Synthèse de la plaquette institutionnelle, à confirmer par les documents maîtrisés du système qualité.</p></summary><div class="defs">${GROUP.map(([t,d])=>`<div><b>${esc(t)}</b><p>${esc(d)}</p></div>`).join('')}</div><p class="pb foot">Points à auditer à la prise de poste : statut exact ISO 9001 / EN 9100, inventaire machine par machine, capacité disponible, ERP utilisé, respect réel des 48 h et portefeuille clients actif.</p></details>`;
}

function vReview(){
  const k=kpis(),v=l=>{const x=k.find(y=>y.l===l);return x.v==='—'?'non renseigné':x.v+(x.u?' '+x.u:'')};
  const f=analyse();
  const lastMeet=[...db.meetings].sort((a,b)=>String(b.date).localeCompare(String(a.date)))[0];
  const aO=db.actions.filter(r=>isOpen('actions',r));
  const sup=db.supply,supBad=sup.filter(r=>r.status==='Bloqué'||isLate('supply',r,'need')||(r.status==='Réceptionné'&&!r.certificate));
  const auditsDone=db.audits.filter(r=>r.result&&r.result!=='Planifié');
  const I=[
    ['État des actions des revues précédentes',lastMeet?`Dernière revue le ${fmtDate(lastMeet.date)}. ${plural(aO.length,'action ouverte')}, dont ${db.actions.filter(r=>isLate('actions',r)).length} en retard.`:'Aucune revue enregistrée.',lastMeet?(db.actions.some(r=>isLate('actions',r))?'bad':'ok'):'warn'],
    ['Évolution des enjeux externes et internes','À compléter en séance : marché, clients, réglementation, organisation.','warn'],
    ['Satisfaction client et retours',db.complaints.length?`${plural(db.complaints.filter(r=>isOpen('complaints',r)).length,'réclamation ouverte')} sur ${db.complaints.length}. Livraisons à l’heure : ${v('Livraisons à l’heure')}.`:'Aucune réclamation enregistrée ; satisfaction à mesurer.',db.complaints.some(r=>isOpen('complaints',r)&&r.severity==='Critique')?'bad':db.complaints.length?'ok':'warn'],
    ['Atteinte des objectifs qualité',`Livraisons à l’heure : ${v('Livraisons à l’heure')}. Marge moyenne : ${v('Marge moyenne des affaires')}. Objectifs chiffrés à valider en séance.`,'warn'],
    ['Performance des processus et conformité des produits',`${plural(db.nc.filter(r=>isOpen('nc',r)).length,'NC ouverte')}. ${plural(db.methods.filter(r=>(gapOf(r)??0)>15).length,'dérive')} de temps au-delà de 15 %. Charge moyenne : ${v('Charge atelier moyenne')}. ${(()=>{const s=imprStats();return `TRS : ${s.oee?pct(s.oee.trs):'non mesuré'} ; ${plural(s.sig.length,'caractéristique')} hors contrôle${s.cpk?`, Cpk le plus faible ${f2(s.cpk.c.cpk)}`:''}.`})()}`,db.nc.some(r=>isOpen('nc',r))?'warn':db.nc.length?'ok':'warn'],
    ['Non-conformités et actions correctives',db.nc.length?`${db.nc.length} NC au total, ${db.nc.filter(r=>r.status==='Close – efficace').length} closes avec efficacité vérifiée.`:'Aucune NC enregistrée : vérifier que le registre est tenu.',db.nc.length?(db.nc.some(r=>isLate('nc',r))?'bad':'ok'):'warn'],
    ['Résultats de surveillance et de mesure',db.instruments.length?`${plural(db.instruments.length,'instrument')} suivi${db.instruments.length>1?'s':''} ; ${v('Instruments échus')} échu(s) ; ${plural(db.msa.filter(r=>!msaCalc(r).err).length,'étude R&R')} complète${db.msa.filter(r=>!msaCalc(r).err).length>1?'s':''}.`:'Parc de mesure non inventorié.',db.instruments.some(r=>calInfo(r).label==='Échu')?'bad':db.instruments.length?'ok':'warn'],
    ['Résultats d’audits',auditsDone.length?`${plural(auditsDone.length,'audit réalisé')} ; ${db.audits.filter(r=>/Écart/.test(r.result||'')).length} avec écart.`:'Aucun audit réalisé enregistré.',db.audits.some(r=>r.result==='Écart majeur')?'bad':auditsDone.length?'ok':'warn'],
    ['Performance des prestataires externes',sup.length?`${plural(sup.length,'approvisionnement')} ; ${supBad.length} en anomalie (retard, blocage ou certificat manquant).`:'Aucun approvisionnement suivi.',supBad.length?'bad':sup.length?'ok':'warn'],
    ['Adéquation des ressources',db.machines.length?`${plural(db.machines.length,'machine')} ; charge moyenne ${v('Charge atelier moyenne')} ; ${db.machines.filter(r=>['Panne','Arrêt'].includes(r.status)).length} à l’arrêt.`:'Parc machine non renseigné. Compétences et effectifs à présenter en séance.','warn'],
    ['Efficacité des actions face aux risques et opportunités',`${plural(f.filter(x=>x.prio==='Haute').length,'alerte haute')} des agents, dont ${f.filter(x=>x.prio==='Haute'&&db.approvals[x.key]).length} prise(s) en compte.`,f.some(x=>x.prio==='Haute'&&!db.approvals[x.key])?'bad':'ok'],
    ['Opportunités d’amélioration',db.projects.length||db.ideas.length?`${plural(db.ideas.filter(r=>OPEN_EXTRA.ideas(r)).length,'idée')} en cours de PDCA, ${db.ideas.filter(r=>r.status==='Act – standardisée').length} standardisée(s) ; ${plural(db.projects.length,'projet DMAIC')}, ${db.projects.filter(r=>r.stage==='Control').length} sous contrôle ; gain estimé ${fmtNum(db.projects.reduce((s,r)=>s+(parseNum(r.gain)||0),0))} € / an.`:'Aucun projet ni idée d’amélioration enregistré.',db.projects.length||db.ideas.length?'ok':'warn'],
  ];
  const statusWord={bad:'À traiter',warn:'À compléter',ok:'Renseigné'};
  const aiG=db.ai.status!=='Désactivée'?aiGate('Direction'):null;
  const ai=aiG?`<section class="panel noprint"><header class="ph"><div><h2>Projet de compte rendu</h2><p>Rédigé par IA à partir des éléments ci-dessus, dans le cadre de la décision de l’entreprise. Texte à relire et valider : ce n’est pas une preuve.</p></div><div class="pa"><button class="btn q" data-act="ai" data-write${aiG.ok&&!aiBusy?'':' disabled'} title="${esc(aiG.reason)}">${aiBusy&&aiBusyAgent==='Direction'?'Rédaction en cours…':'Rédiger le projet'}</button></div></header><div class="pb">${aiG.ok?'':`<p class="nil">${esc(aiG.reason)}</p>`}<div class="ai-out" aria-live="polite">${esc(aiText||'Aucun projet rédigé.')}</div>${aiOk&&!aiBusy?`<p><button class="btn" data-act="new" data-coll="meetings" data-pre-ai="1" data-write>Créer la fiche de revue avec ce texte</button></p>`:''}</div></section>`:'';
  reviewInputs=I;
  return `<div class="pa noprint" style="margin:-8px 0 16px"><button class="btn" data-act="new" data-coll="meetings" data-write>+ Enregistrer une revue</button><button class="btn q" data-act="print">Imprimer l’ordre du jour</button></div>`
  +releveHTML(k)
  +`<section class="panel"><header class="ph"><div><h2>Éléments d’entrée</h2><p>Calculés le ${esc(fmtStamp(nowISO()))} à partir des fiches enregistrées.</p></div></header><ol class="inputs">${I.map(([t,d,s])=>`<li><div><b>${esc(t)}</b><small>${esc(d)}</small></div>${tag(statusWord[s],s)}</li>`).join('')}</ol></section>`
  +ai
  +panel({title:'Revues enregistrées',sub:'Décisions, participants et données présentées.',coll:'meetings',body:tableHTML('meetings')});
}
let reviewInputs=[],AI=null,aiText='',aiOk=false,aiBusy=false,aiBusyAgent='';

function vAgents(){
  const f=analyse();
  const agents=[['Qualité','Normes, preuves, audits, NC, AMDEC et analyses de causes.'],['Métrologie','Échéances d’étalonnage, études R&R et impact sur les mesures.'],['Production','Parc, arrêts, saturation, TRS, audits 5S.'],['Industrialisation','Validation série et dossiers manquants avant production.'],['Méthodes','Dérives de temps entre prévu et réel.'],['Commercial','Marge, chiffrage incomplet, délai d’ARC, dépendance client.'],['Flux et SAV','Certificats, blocages, retards fournisseurs et clients, réclamations.'],['Black Belt','Pareto, MSP et capabilité, relevés de défauts, idées, projets.'],['Direction','Actions en retard et arbitrages.']];
  const cnt=a=>f.filter(x=>x.agent===a&&x.prio!=='Basse').length;
  const rows=f.map(x=>{const ok=db.approvals[x.key];return `<tr><td><b>${esc(x.agent)}</b></td><td>${tag(x.prio,prioTone(x.prio))}</td><td>${esc(x.finding)}${x.ref?`<br><span class="ref">${esc(x.ref)}</span>`:''}</td><td>${esc(x.action)}</td><td class="acts">${ok?`<small class="nil">Pris en compte le ${esc(fmtStamp(ok.at))}</small>`:`<button class="btn q s" data-act="ack" data-key="${esc(x.key)}" data-write>Prendre en compte</button>`} ${x.agent==='Direction'&&x.prio==='Basse'?'':`<button class="btn s" data-act="to-action" data-key="${esc(x.key)}" data-write>Créer l’action</button>`}</td></tr>`}).join('');
  return `<p class="note info"><b>Fonctionnement :</b>les recommandations sont recalculées à chaque modification. « Prendre en compte » est mémorisé tant que la situation ne change pas ; si de nouvelles fiches apparaissent, l’alerte revient.</p>`
  +`<section class="panel"><header class="ph"><div><h2>Agents actifs</h2><p>${db.lastRun?`Dernière analyse consignée le ${esc(fmtStamp(db.lastRun.at))}.`:'Aucune analyse consignée au journal.'}</p></div><div class="pa"><button class="btn" data-act="run">Consigner l’analyse</button></div></header><div class="defs">${agents.map(([a,d])=>`<div><b>${esc(a)} ${cnt(a)?tag(plural(cnt(a),'signal','signaux'),'warn'):tag('RAS','ok')}</b><p>${esc(d)}</p>${aiBtn(a)}</div>`).join('')}</div></section>`
  +`<section class="panel"><header class="ph"><div><h2>Centre de recommandations</h2><p>${plural(f.length,'recommandation')}, les priorités hautes en premier.</p></div></header><div class="tw"><table><thead><tr><th>Agent</th><th>Priorité</th><th>Constat</th><th>Action recommandée</th><th><span class="sr">Actions</span></th></tr></thead><tbody>${rows}</tbody></table></div></section>`+aiAgentsBlock();
}

function traceHTML(){
  const ref=traceRef.trim();
  if(!ref)return '';
  const order=['deals','customers','industrial','fmea','methods','supply','machines','instruments','spc','msa','oee','checks','shipments','nc','complaints','rca','actions','ideas','projects','audits'];

const dlg=$('#dlg');
let dlgResolve=null,dlgReturn=null,formCtx=null,customSubmit=null;
function openDialog({title,sub='',body='',buttons=[],onSubmit=null}){
  customSubmit=onSubmit;if(!dlg.open)dlgReturn=document.activeElement;
  $('#dlgT').textContent=title;$('#dlgS').textContent=sub;$('#dlgB').innerHTML=body;
  $('#dlgA').innerHTML=buttons.map(b=>`<button type="${b.submit?'submit':'button'}" class="btn ${b.cls||''}" value="${esc(b.v)}" data-dv="${esc(b.v)}">${esc(b.l)}</button>`).join('');
  if(!dlg.open)dlg.showModal();
  setTimeout(()=>($('#dlgB [autofocus]')||$('#dlgB input,#dlgB select,#dlgB textarea')||$('#dlgA .btn:last-child'))?.focus(),20);
  return new Promise(res=>{dlgResolve=res});
}
function closeDialog(val){const r=dlgResolve;dlgResolve=null;formCtx=null;customSubmit=null;if(dlg.open)dlg.close();r?.(val);dlgReturn?.focus?.()}
$('#dlgA').addEventListener('click',e=>{const b=e.target.closest('[data-dv]');if(!b||b.type==='submit')return;closeDialog(b.dataset.dv)});
dlg.addEventListener('cancel',e=>{e.preventDefault();closeDialog('cancel')});
dlg.addEventListener('click',e=>{if(e.target===dlg)closeDialog('cancel')});
$('#dlgF').addEventListener('submit',e=>{e.preventDefault();if(formCtx)saveForm();else if(customSubmit)customSubmit();else closeDialog('ok')});
const confirmBox=(title,text,ok='Confirmer',cls='')=>openDialog({title,sub:text,buttons:[{l:'Annuler',v:'cancel',cls:'q'},{l:ok,v:'ok',cls}]}).then(v=>v==='ok');

function listOptions(f){
  if(Array.isArray(f.list))return f.list;
  if(f.list==='customers')return [...new Set(db.customers.map(r=>r.customer).filter(Boolean))];
  if(f.list==='machines')return [...new Set(db.machines.map(r=>r.name).filter(Boolean))];
  if(f.list==='instruments')return [...new Set(db.instruments.map(r=>r.code).filter(Boolean))];
  return [];
}
function fieldHTML(c,f,val,ro){
  if(f.type==='hidden')return '';
  const id='f_'+f.k,req=f.req?' required':'',dis=ro?' disabled':'',star=f.req?' <span class="req" aria-hidden="true">*</span>':'';
  const wide=f.type==='textarea'||f.wide?' wide':'';
  let ctl;
  const ph=f.ph?` placeholder="${esc(f.ph)}"`:'';
  if(f.type==='textarea')ctl=`<textarea id="${id}" name="${f.k}" maxlength="${f.maxlen||5000}"${ph}${req}${dis}${f.mono?' class="ref"':''}${f.maxlen?' rows="8"':''}>${esc(val)}</textarea>`;
  else if(f.type==='select'){const opts=[...f.opts];if(val&&!opts.includes(val))opts.unshift(val);ctl=`<select id="${id}" name="${f.k}"${dis}>${f.def||val?'':'<option value="">Choisir…</option>'}${opts.map(o=>`<option value="${esc(o)}"${String(o)===String(val)?' selected':''}>${esc(o)}</option>`).join('')}</select>`}
  else{
    const type=f.type==='date'?'date':'text',isNum=f.type==='number';
    if(isNum&&val!==''&&val!==null&&val!==undefined)val=String(val).replace('.',',');
    const lo=listOptions(f),lid=lo.length?` list="dl_${f.k}"`:'';
    const extra=isNum?` inputmode="decimal" pattern="\\s*[\\-+]?[\\d\\s ]*[.,]?\\d*\\s*" data-num="1"${f.min!=null?` data-min="${f.min}"`:''}${f.max!=null?` data-max="${f.max}"`:''} title="Nombre, virgule décimale acceptée" maxlength="40"`:(type==='text'?' maxlength="300"':'');
    ctl=`<input id="${id}" name="${f.k}" type="${type}" value="${esc(val)}"${lid}${extra}${ph}${req}${dis}${f.mono?' class="ref"':''}>${lo.length?`<datalist id="dl_${f.k}">${lo.map(o=>`<option value="${esc(o)}">`).join('')}</datalist>`:''}`;
  }
  return `<label class="${wide.trim()}" for="${id}"><span>${esc(f.l)}${star}</span>${ctl}</label>`;
}
function openForm(c,id,pre={},opts={}){
  const s=SCHEMA[c];if(!s)return;
  const rec=id?db[c].find(r=>r.id===id):null;
  if(id&&!rec){toast('Fiche introuvable : elle a peut-être été supprimée.');return}
  const ro=isRO();
  formCtx={c,id:rec?.id||null,after:opts.after||null};
  const val=f=>{if(rec)return rec[f.k]??'';if(pre[f.k]!==undefined)return pre[f.k];if(f.def==='today')return todayISO();if(f.def==='cpk')return db.meta.targets.cpk;if(f.def!==undefined)return f.def;if(f.type==='select')return f.opts[0];return ''};
  const body=`<div class="fgrid">${s.fields.map(f=>fieldHTML(c,f,val(f),ro)).join('')}${rec?`<div class="meta">Créée le ${esc(fmtStamp(rec.created))}${rec.updated?`, modifiée le ${esc(fmtStamp(rec.updated))}`:''}.</div>`:''}</div>`;
  openDialog({title:(ro?'Consulter':rec?'Modifier':'Nouvelle fiche')+' : '+s.name.toLowerCase(),sub:ro?'Rôle en lecture seule : aucune modification possible.':'Saisis uniquement une information vérifiée. Les champs marqués * sont obligatoires.',body,buttons:ro?[{l:'Fermer',v:'cancel'}]:[{l:'Annuler',v:'cancel',cls:'q'},{l:rec?'Enregistrer':'Créer la fiche',v:'save',submit:true}]});
}
function saveForm(){
  const {c,id,after}=formCtx||{};if(!c||isRO())return;
  const form=$('#dlgF');
  $$('#dlgB [data-num]').forEach(e=>e.setCustomValidity(''));
  for(const el of $$('#dlgB [required]'))if(!String(el.value).trim()){el.value='';}
  if(!form.checkValidity()){form.reportValidity();return}
  const s=SCHEMA[c],data={};
  const aft=()=>{const m=s.check?.(data);if(m){toast(m);return false}return true};
  let numBad=false;
  for(const f of s.fields){const el=$('#dlgB').querySelector(`[name="${f.k}"]`);if(!el)continue;let v=String(el.value??'').trim();
    if(f.type==='number'){el.setCustomValidity('');const n=v===''?null:parseNum(v);
      if(v!==''&&(n===null||!/^[-+]?[\d\s ]*[.,]?\d*$/.test(v)))el.setCustomValidity('Nombre attendu (virgule décimale acceptée).');
      else if(n!==null&&f.min!=null&&n<f.min)el.setCustomValidity(`Valeur minimale : ${f.min}.`);
      else if(n!==null&&f.max!=null&&n>f.max)el.setCustomValidity(`Valeur maximale : ${f.max}.`);
      if(el.validationMessage){numBad=true;continue}
      data[f.k]=n}
    else data[f.k]=v}
  if(numBad){form.reportValidity();return}
  if(id){
    const r=db[c].find(x=>x.id===id);if(!r){toast('Fiche introuvable.');closeDialog('cancel');return}
    if(!aft())return;
    const changed=s.fields.filter(f=>f.type!=='hidden'&&String(r[f.k]??'')!==String(data[f.k]??'')).map(f=>f.l);
    if(!changed.length){closeDialog('ok');toast('Aucune modification.');return}
    Object.assign(r,data,{updated:nowISO()});log('Modification',c,r,changed.join(', '));toast('Fiche enregistrée.');
  }else{
    if(!aft())return;
    const r={id:uid(),created:nowISO(),...data};db[c].push(r);log('Création',c,r);if(after)after(r);toast('Fiche créée.');
  }
  persist();closeDialog('ok');render();
}
async function del(c,id){
  const i=db[c].findIndex(r=>r.id===id);if(i<0){toast('Fiche introuvable.');return}
  const r=db[c][i];
  if(!await confirmBox('Supprimer cette fiche ?',`${SCHEMA[c].name} « ${String(r[SCHEMA[c].tk]||r.ref||'sans titre').slice(0,80)} ». La suppression est consignée au journal ; pense à exporter une sauvegarde avant.`,'Supprimer'))return;
  const j=db[c].findIndex(x=>x.id===id);if(j<0)return;
  db[c].splice(j,1);log('Suppression',c,r);persist();render();toast('Fiche supprimée.');
}

/* ───────── Import / export ───────── */
let DL=null;
async function download(name,text,mime){
  if(DL){try{await DL.save({filename:name,data:text});toast('Fichier enregistré.');return}catch(e){const code=e?.code;if(code==='declined'){toast('Enregistrement annulé.');return}if(code==='rate_limited'){toast('Une demande est déjà ouverte, réessaie dans un instant.');return}if(!['unavailable','not_granted','capability_disabled','capability_removed'].includes(code)){toast('Export impossible : '+(e?.message||code||'erreur'));return}DL=null}}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);toast('Fichier exporté.');
}
const stamp=()=>todayISO();
const csvCell=v=>{let s=String(v??'');if(/^[=+\-@\t\r]/.test(s))s="'"+s;return /[";\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
function exportCSV(c){
  const s=SCHEMA[c],head=[...s.fields.map(f=>f.l),'Créée le','Modifiée le','Identifiant'];
  const rows=db[c].map(r=>[...s.fields.map(f=>f.type==='date'?fmtDate(r[f.k]):r[f.k]),fmtStamp(r.created),r.updated?fmtStamp(r.updated):'',r.id]);
  if(!rows.length){toast('Aucune fiche à exporter.');return}
  download(`mecaria-${c}-${stamp()}.csv`,'\uFEFF'+[head,...rows].map(l=>l.map(csvCell).join(';')).join('\r\n'),'text/csv');
}
function exportLog(){
  if(!db.auditLog.length){toast('Journal vide.');return}
  const rows=[['Date','Rôle','Opération','Module','Fiche','Détail'],...db.auditLog.map(e=>[fmtStamp(e.at),e.role,e.action,COLL_LABEL[e.coll]||e.coll,e.label,e.detail])];

/* ───────── IA gouvernée : coffre des clés (AES-256-GCM / PBKDF2) ───────── */
const b64=buf=>{let s='';const u=new Uint8Array(buf);for(let i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function sanitizeKey(k){const s=String(k||'').replace(/[\s\u200B-\u200D\uFEFF"'`]/g,'');return /^[A-Za-z0-9_\-.:]{16,300}$/.test(s)?s:''}
const Vault={keys:{},ck:null,salt:null,has:false,session:false,
  get supported(){return !!(window.crypto&&crypto.subtle&&window.isSecureContext!==false)},
  get unlocked(){return !!this.ck||this.session},
  async init(){try{this.has=!!(await Store.get('vault'))}catch{this.has=false}},
  async derive(pass,salt){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])},
  async create(pass){this.salt=crypto.getRandomValues(new Uint8Array(16));this.ck=await this.derive(pass,this.salt);this.keys={};await this.write();this.has=true},
  async unlock(pass){const v=JSON.parse(await Store.get('vault'));const salt=unb64(v.salt),ck=await this.derive(pass,salt);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(v.iv)},ck,unb64(v.ct));this.keys=JSON.parse(new TextDecoder().decode(pt));this.ck=ck;this.salt=salt},
  async write(){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},this.ck,new TextEncoder().encode(JSON.stringify(this.keys)));await Store.set('vault',JSON.stringify({v:1,salt:b64(this.salt),iv:b64(iv),ct:b64(ct)}))},
  async setKey(id,key){this.keys[id]=key;if(this.ck)await this.write()},
  async removeKey(id){delete this.keys[id];if(this.ck)await this.write()},
  lock(){this.keys={};this.ck=null;this.salt=null;this.session=false},
  async forget(){this.lock();await Store.set('vault','');this.has=false},
};
async function sha256(s){try{const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('')}catch{return 'djb2-'+hash(s)}}

/* ───────── IA gouvernée : minimisation et pseudonymisation ───────── */
const rxEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function makePseudo(on){
  const idt={text:s=>String(s??''),back:s=>String(s??'')};
  if(!on)return idt;
  const map=new Map(),rev=new Map(),cnt={PERS:0,CLI:0,FOU:0};
  const add=(name,pre)=>{name=String(name||'').trim();if(name.length<2||map.has(name.toLowerCase()))return;const t=`${pre}-${++cnt[pre]}`;map.set(name.toLowerCase(),t);rev.set(t,name)};
  for(const c of COLLS)for(const r of db[c])if(r.customer)add(r.customer,'CLI');
  db.supply.forEach(r=>add(r.supplier,'FOU'));db.shipments.forEach(r=>add(r.carrier,'FOU'));
  for(const c of COLLS)for(const r of db[c]){if(r.owner)add(r.owner,'PERS');if(r.participants)String(r.participants).split(/[,;/]|\bet\b/).forEach(n=>add(n,'PERS'))}
  add(db.ai.user,'PERS');if(db.ai.decision)add(db.ai.decision.by,'PERS');
  const names=[...map.keys()].sort((a,b)=>b.length-a.length);
  const re=names.length?new RegExp(`(?<![\\p{L}\\p{N}])(?:${names.map(rxEsc).join('|')})(?![\\p{L}\\p{N}])`,'giu'):null;
  return {text:s=>re?String(s??'').replace(re,m=>map.get(m.toLowerCase())||m):String(s??''),back:s=>String(s??''),rev};
}
function derivedFor(c,r){

  if(c==='nc'||c==='actions')return {'En retard (calculé)':isLate(c,r)?'oui':'non'};
  if(c==='spc'){const x=spcCalc(r);return x.err?{'Données':'incomplètes'}:{'Sous-groupes':x.k,'Moyenne':+x.mean.toFixed(5),'Cp':x.cp===null?null:+x.cp.toFixed(2),'Cpk':x.cpk===null?null:+x.cpk.toFixed(2),'Ppk':x.ppk===null?null:+x.ppk.toFixed(2),'Hors tolérance':x.out,'Signaux':Object.keys(x.signals).map(k=>RULES[k])}}

  if(c==='oee'){const x=oeeCalc(r);return {'TRS %':x.trs===null?null:+(x.trs*100).toFixed(1),'Disponibilité %':x.D===null?null:+(x.D*100).toFixed(1),'Performance %':x.P===null?null:+(x.P*100).toFixed(1),'Qualité %':x.Q===null?null:+(x.Q*100).toFixed(1)}}

function buildPayload(agent){

function xhrChat(p,key,messages){
  return new Promise((res,rej)=>{
    const x=new XMLHttpRequest();
    try{x.open('POST',PROV[p.id].url,true)}catch{rej(new Error('URL refusée'));return}
    x.timeout=90000;x.setRequestHeader('Content-Type','application/json');x.setRequestHeader('Authorization','Bearer '+key);
    x.onload=()=>{
      if(x.status>=200&&x.status<300){try{const j=JSON.parse(x.responseText),t=j?.choices?.[0]?.message?.content;if(typeof t!=='string'||!t.trim())throw 0;res(t)}catch{rej(new Error('réponse illisible'))}}
      else rej(new Error(x.status===401||x.status===403?'clé refusée':x.status===429?'quota ou limite de débit atteint':x.status===404?`modèle « ${p.model} » introuvable`:x.status===400?'requête refusée (modèle ou paramètres)':`erreur HTTP ${x.status}`));
    };

    x.ontimeout=()=>rej(new Error('délai de 90 s dépassé'));

  });

  }catch(e){run.error=String(e?.message||e).slice(0,400)}
  storeRun(run);
  log('Analyse IA','',null,`${agent} : ${run.ok?`${run.provider}, ${plural(run.propositions.length,'proposition')}, empreinte ${run.hash.slice(0,12)}`:'échec, '+run.error}`);
  aiBusy=false;aiBusyAgent='';persist();render();
  toast(run.ok?`${plural(run.propositions.length,'proposition')} en attente de décision.`:'Analyse IA impossible : '+run.error);
}

/* ───────── IA gouvernée : décisions humaines ───────── */
async function aiDecide(runId,propId,verdict){
  const run=db.aiRuns.find(r=>r.id===runId),p=run?.propositions.find(x=>x.id===propId);
  if(!p||p.decision)return;
  const needNote=verdict==='reject'||verdict==='irrelevant';
  const L={accept:'Accepter et créer l’action',reject:'Rejeter la proposition',relevant:'Juger pertinente',irrelevant:'Juger non pertinente'};
  let by='',note='';
  const v=await openDialog({title:L[verdict],sub:'Décision humaine consignée au journal et au registre IA.',
    body:`<p><b>${esc(p.action)}</b><br><small class="nil">${esc(p.justification)}</small></p><div class="fgrid"><label class="wide" for="decBy"><span>Décideur, nom et fonction <span class="req">*</span></span><input id="decBy" required maxlength="120" value="${esc(db.ai.user)}"></label><label class="wide" for="decNote"><span>Justification${needNote?' <span class="req">*</span>':' (facultative)'}</span><textarea id="decNote" maxlength="1000"${needNote?' required':''}></textarea></label></div>`,
    buttons:[{l:'Annuler',v:'cancel',cls:'q'},{l:L[verdict],v:'ok',submit:true}],
    onSubmit:()=>{const i=$('#decBy'),n=$('#decNote');i.value=i.value.trim();n.value=n.value.trim();if(!$('#dlgF').checkValidity()){$('#dlgF').reportValidity();return}by=i.value;note=n.value;closeDialog('ok')}});
  if(v!=='ok')return;
  db.ai.user=by;
  const record=(val,actionId='')=>{p.decision={v:val,by,at:nowISO(),note,actionId};log('Décision IA','',null,`${val} par ${by} : ${p.action}${note?' ('+note+')':''}`);persist();render()};
  if(verdict==='accept'){
    openForm('actions',null,{title:p.action.slice(0,300),ref:p.ref,priority:p.priorite,owner:'',status:'Ouverte',evidence:`Origine : proposition générée par IA (${run.provider}, ${fmtStamp(run.at)}), acceptée par ${by}.${note?' Justification : '+note+'.':''} Preuve attendue : ${p.preuve||'à définir'}. Exigence : ${p.exigence||'à confirmer'}.`},{after:rec=>record('acceptée',rec.id)});
    toast('Désigne le responsable et l’échéance pour finaliser la décision.');
  }else record({reject:'rejetée',relevant:'pertinente',irrelevant:'non pertinente'}[verdict]);
}

  <label for="dBy"><span>Décideur <span class="req">*</span></span><input id="dBy" maxlength="120" value="${esc(d.by||a.user)}" required></label>
  <label for="dFn"><span>Fonction</span><input id="dFn" maxlength="120" value="${esc(d.fn||'')}"></label>

  <label for="dRef"><span>Référence (PV de CODIR, note…)</span><input id="dRef" maxlength="120" value=""></label>

  ${open.length?`<div class="wide note" style="margin:0"><b>${plural(open.length,'exigence')} non documentée${open.length>1?'s':''} :</b>${esc(open.slice(0,4).map(x=>x[0]+' – '+x[1].split(':')[0]).join(' ; '))}${open.length>4?'…':''}</div><label class="wide chk" for="dAck"><input id="dAck" type="checkbox"> <span>L’entreprise active l’IA en connaissance de ces exigences ouvertes et s’engage à les traiter.</span></label>`:''}
  </div>`;
  const v=await openDialog({title:'Décision de l’entreprise sur l’IA',sub:'Cette décision encadre tous les usages d’IA du cockpit. Elle est historisée.',body,buttons:[{l:'Annuler',v:'cancel',cls:'q'},{l:'Enregistrer la décision',v:'ok',submit:true}],
    onSubmit:()=>{
      const st=$('#dSt').value,by=$('#dBy'),date=$('#dDate'),rev=$('#dRev'),ack=$('#dAck');
      [by,date,rev].forEach(e=>e.setCustomValidity(''));ack?.setCustomValidity('');
      by.value=by.value.trim();
      if(!by.value)by.setCustomValidity('Indique le décideur.');
      if(!isISO(date.value))date.setCustomValidity('Indique la date.');
      if(st!=='Désactivée'){
        if(!isISO(rev.value)||daysFromToday(rev.value)<=0)rev.setCustomValidity('Une date de réexamen future est obligatoire pour activer l’IA.');
        if(ack&&!ack.checked)ack.setCustomValidity('Confirme la prise en compte des exigences ouvertes.');
      }
      if(!$('#dlgF').reportValidity())return;
      const dec=aiDecision({status:st,by:by.value,fn:$('#dFn').value.trim(),date:date.value,ref:$('#dRef').value.trim(),review:st==='Désactivée'?'':rev.value,scope:$('#dScope').value.trim(),ack:!!ack?.checked,at:nowISO()});
      if(a.decision)a.history.push(a.decision);if(a.history.length>50)a.history.shift();
      a.decision=dec;a.status=st;a.user=dec.by;
      log('Décision IA','',null,`${st} par ${dec.by}${dec.ref?' ('+dec.ref+')':''}${dec.review?', réexamen le '+fmtDate(dec.review):''}${open.length&&st!=='Désactivée'?', '+open.length+' exigence(s) ouverte(s) acceptée(s)':''}`);
      persist();closeDialog('ok');render();toast(`Décision enregistrée : IA ${st.toLowerCase()}.`);
    }});
  return v;
}
async function vaultAction(kind,id){
  if(db.meta.role!=='Directeur'){toast('Gestion des clés réservée au rôle Directeur.');return}
  if(kind==='create'||kind==='unlock'){
    if(!Vault.supported){Vault.session=true;toast('Chiffrement indisponible ici : les clés resteront en mémoire pour cette session seulement.');render();return}
    const create=kind==='create';
    await openDialog({title:create?'Créer le coffre des clés':'Déverrouiller le coffre',sub:create?'Les clés d’API sont chiffrées (AES-256-GCM, clé dérivée PBKDF2) dans ce navigateur. La phrase de passe n’est jamais enregistrée : si elle est perdue, il faudra recréer le coffre.':'Les clés restent déchiffrées en mémoire jusqu’au verrouillage ou à la fermeture de la page.',
      body:`<div class="fgrid"><label class="wide" for="vp1"><span>Phrase de passe (12 caractères minimum) <span class="req">*</span></span><input id="vp1" type="password" autocomplete="${create?'new-password':'current-password'}" minlength="12" required></label>${create?`<label class="wide" for="vp2"><span>Confirmation <span class="req">*</span></span><input id="vp2" type="password" autocomplete="new-password" required></label>`:''}</div>`,
      buttons:[{l:'Annuler',v:'cancel',cls:'q'},{l:create?'Créer':'Déverrouiller',v:'ok',submit:true}],
      onSubmit:async()=>{
        const p1=$('#vp1'),p2=$('#vp2');p1.setCustomValidity('');p2?.setCustomValidity('');
        if(p1.value.length<12)p1.setCustomValidity('12 caractères minimum.');
        if(p2&&p2.value!==p1.value)p2.setCustomValidity('Les deux saisies diffèrent.');
        if(!$('#dlgF').reportValidity())return;
        try{if(create)await Vault.create(p1.value);else await Vault.unlock(p1.value);log(create?'Coffre créé':'Coffre déverrouillé','',null,'');persist();closeDialog('ok');render();toast(create?'Coffre créé et déverrouillé.':'Coffre déverrouillé.')}
        catch{p1.setCustomValidity('Phrase de passe incorrecte ou coffre illisible.');$('#dlgF').reportValidity()}
      }});
    return;
  }
  if(kind==='lock'){Vault.lock();log('Coffre verrouillé','',null,'');persist();render();toast('Coffre verrouillé.');return}
  if(kind==='forget'){if(!await confirmBox('Supprimer le coffre ?','Toutes les clés enregistrées dans ce navigateur seront effacées.','Supprimer'))return;await Vault.forget();log('Coffre supprimé','',null,'');persist();render();toast('Coffre supprimé.');return}
  if(kind==='key'){
    if(!Vault.unlocked){toast(Vault.has?'Déverrouille d’abord le coffre.':'Crée d’abord le coffre des clés.');return}
    await openDialog({title:`Clé d’API : ${PROV[id].label}`,sub:'La clé n’est jamais exportée, affichée ni consignée au journal. Utilise une clé dédiée à ce cockpit, révocable, avec des droits minimaux.',
      body:`<div class="fgrid"><label class="wide" for="kv"><span>Clé <span class="req">*</span></span><input id="kv" type="password" autocomplete="off" spellcheck="false" required></label></div>`,
      buttons:[{l:'Annuler',v:'cancel',cls:'q'},{l:'Enregistrer la clé',v:'ok',submit:true}],
      onSubmit:async()=>{const i=$('#kv'),k=sanitizeKey(i.value);i.setCustomValidity(k?'':'Format de clé non reconnu.');if(!$('#dlgF').reportValidity())return;try{await Vault.setKey(id,k);log('Clé enregistrée','',null,PROV[id].label);persist();closeDialog('ok');render();toast('Clé enregistrée.')}catch{toast('Échec du chiffrement de la clé.')}}});
    return;
  }
  if(kind==='key-del'){await Vault.removeKey(id);log('Clé retirée','',null,PROV[id].label);persist();render();toast('Clé retirée.')}
}

  return `<p style="margin:8px 0 0"><button class="btn q s" data-act="ai-run" data-agent="${esc(agent)}" data-write${g.ok&&!aiBusy?'':' disabled'} title="${esc(g.reason)}">${busy?'Analyse en cours…':'Analyse IA'}</button></p>`;
}
function aiStatusLine(){
  const a=db.ai,g=aiGate(null),d=a.decision;
  const t=a.status==='Activée'?'ok':a.status==='Désactivée'?'neu':'warn';
  return `<p class="note ${g.ok?'info':''}"><b>IA générative : ${esc(a.status)}.</b>${d?` Décision de ${esc(d.by)} le ${esc(fmtDate(d.date))}${d.review?`, réexamen le ${esc(fmtDate(d.review))}`:''}.`:' Aucune décision enregistrée.'} ${g.ok?`Fournisseurs prêts : ${esc(readyProviders().map(p=>PROV[p.id].label).join(', '))}.`:esc(g.reason)} ${tag(a.status,t)} <button class="btn q s" data-act="nav" data-view="aigov">Gouvernance IA</button></p>`;
}
function decBtns(r,p){
