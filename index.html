  +`<section class="panel"><header class="ph"><div><h2>${esc(r.title)}</h2><p>${r.ref?`<span class="ref">${esc(r.ref)}</span>, `:''}${esc(r.owner||'animateur à désigner')}</p></div><div class="pa">${tag(r.status||ST.rca[0])}<button class="btn q s" data-act="edit" data-coll="rca" data-id="${esc(r.id)}">${isRO()?'Voir':'Compléter'}</button>${r.action?`<button class="btn s" data-act="rca-action" data-id="${esc(r.id)}" data-write>Créer l’action corrective</button>`:''}</div></header>
  <div class="defs">${q.map(([t,v])=>`<div><b>${t}</b><p>${esc(v||'—')}</p></div>`).join('')}</div>
  <div class="pb"><h3 class="h3">Diagramme d’Ishikawa 6M</h3><div class="tw">${fishboneSVG(r)}</div><p class="foot">★ cause retenue (préfixe * dans la fiche). ${M6KEYS.map(([k,l])=>`${l} : ${String(r[k]||'').split(/\r?\n/).filter(s=>s.trim()).length}`).join(', ')}.</p></div>
  <div class="cols eq pb"><div><h3 class="h3">5 Pourquoi</h3>${whys.length?`<ol class="whys">${whys.map(w=>`<li>${esc(w)}</li>`).join('')}</ol>`:'<p class="nil">Pas encore renseigné.</p>'}</div><div><h3 class="h3">Cause racine, action, vérification</h3><dl class="dl"><dt>Cause racine</dt><dd>${esc(r.root||'—')}</dd><dt>Action corrective</dt><dd>${esc(r.action||'—')}</dd><dt>Vérification de l’efficacité</dt><dd>${esc(r.check||'—')}</dd></dl></div></div></section>`
  +panel({title:'Toutes les analyses',coll:'rca',body:tableHTML('rca')});
}

function vSpc(){

function analyseImprove(add,names){
  const T=db.meta.targets,s=imprStats();
  if(s.sig.length)add('x-spc',s.sig.map(x=>x.r.id+x.c.nsig),'Black Belt','Haute',`${plural(s.sig.length,'caractéristique')} hors contrôle statistique : ${names(s.sig.map(x=>x.r),'char')}.`,'Rechercher la cause spéciale (6M) avant tout réglage, consigner la réaction et contrôler les pièces produites depuis le dernier point sous contrôle.',s.sig[0].r.ref||'');
  const lowCpk=s.spc.filter(x=>x.c.cpk!==null&&x.c.cpk<(parseNum(x.r.target)||T.cpk));
  if(lowCpk.length)add('x-cpk',lowCpk.map(x=>x.r.id+f2(x.c.cpk)),'Black Belt',lowCpk.some(x=>x.c.cpk<1)?'Haute':'Moyenne',`${plural(lowCpk.length,'caractéristique')} sous le Cpk visé : ${lowCpk.slice(0,4).map(x=>`${x.r.char} (${f2(x.c.cpk)})`).join(', ')}.`,'Renforcer le contrôle (tri, fréquence) et ouvrir une action de réduction de la dispersion ou de recentrage.',lowCpk[0].r.ref||'');
  const few=s.spc.filter(x=>x.c.k<20);
  if(few.length)add('x-few',few.map(x=>x.r.id+x.c.k),'Black Belt','Basse',`${plural(few.length,'étude MSP')} avec moins de 20 sous-groupes.`,'Compléter les prélèvements avant de figer les limites de contrôle.');
  const badMsa=s.msa.filter(x=>(x.c.pTol??x.c.pGRR)>30),midMsa=s.msa.filter(x=>{const v=x.c.pTol??x.c.pGRR;return v>T.grr&&v<=30}),ndc=s.msa.filter(x=>x.c.ndc!==null&&x.c.ndc<5);
  if(badMsa.length)add('x-grr',badMsa.map(x=>x.r.id),'Métrologie','Haute',`Système de mesure non acceptable : ${badMsa.map(x=>`${x.r.instrument} sur ${x.r.char}`).slice(0,3).join(', ')}.`,'Ne pas s’appuyer sur ce moyen pour accepter ou refuser le produit : améliorer la méthode, le moyen ou la formation, puis refaire l’étude.');
  if(midMsa.length)add('x-grr2',midMsa.map(x=>x.r.id),'Métrologie','Moyenne',`${plural(midMsa.length,'étude R&R')} acceptable${midMsa.length>1?'s':''} sous conditions.`,'Décider formellement de l’acceptation selon l’importance de la caractéristique et le coût d’amélioration.');
  if(ndc.length)add('x-ndc',ndc.map(x=>x.r.id),'Métrologie','Moyenne',`${plural(ndc.length,'étude')} avec moins de 5 catégories distinctes.`,'La résolution du moyen est insuffisante pour distinguer les pièces : revoir le moyen ou l’échantillon de pièces.');
  const incomplete=db.msa.filter(r=>msaCalc(r).err);
  if(incomplete.length)add('x-msa-inc',incomplete.map(r=>r.id),'Métrologie','Basse',`${plural(incomplete.length,'étude R&R')} incomplète${incomplete.length>1?'s':''}.`,'Terminer la saisie de la grille de mesures.');
  const hiIpr=s.ipr.filter(x=>(x.v>=T.ipr||parseNum(x.r.g)>=9)&&!x.r.action);
  if(hiIpr.length)add('x-ipr',hiIpr.map(x=>x.r.id),'Qualité','Haute',`${plural(hiIpr.length,'risque AMDEC')} au-dessus du seuil sans action : ${names(hiIpr.map(x=>x.r),'mode')}.`,'Définir une action de prévention ou de détection, avec responsable et échéance, puis recoter.',hiIpr[0].r.ref||'');
  const lateIpr=db.fmea.filter(r=>OPEN_EXTRA.fmea(r)&&isISO(r.due)&&daysFromToday(r.due)<0);
  if(lateIpr.length)add('x-ipr-late',lateIpr.map(r=>r.id),'Qualité','Moyenne',`${plural(lateIpr.length,'action AMDEC')} en retard.`,'Relancer ou replanifier en revue.');
  if(s.oee&&s.oee.trs*100<T.trs){
    const st={};db.oee.forEach(r=>{const m=parseNum(r.stops)||0;if(m&&r.stopCause&&r.stopCause!=='Aucun')st[r.stopCause]=(st[r.stopCause]||0)+m});const top=Object.entries(st).sort((a,b)=>b[1]-a[1])[0];
    add('x-trs',[String(Math.round(s.oee.trs*1000)),top?.[0]||''],'Production','Moyenne',`TRS global de ${fmtNum(s.oee.trs*100,1)} % sous l’objectif de ${T.trs} %${top?`, première cause d’arrêt : ${top[0]} (${fmtNum(top[1])} min)`:''}.`,top?`Traiter la première cause d’arrêt (${top[0]}) par un chantier ciblé${/réglage|changement/i.test(top[0])?' de type SMED':''}.`:'Qualifier les causes d’arrêt dans les relevés TRS.');
  }
  const noCause=db.oee.filter(r=>(parseNum(r.stops)||0)>0&&(!r.stopCause||r.stopCause==='Aucun'));
  if(noCause.length)add('x-trs-c',noCause.map(r=>r.id),'Production','Basse',`${plural(noCause.length,'relevé TRS')} avec arrêts sans cause.`,'Renseigner la cause d’arrêt pour fiabiliser le Pareto.');
  const low5=s.zones.filter(z=>z.s!==null&&z.s<T.s5),drop=s.zones.filter(z=>z.s!==null&&z.p!==null&&z.s<z.p-10);
  if(low5.length)add('x-5s',low5.map(z=>z.last.id),'Production','Moyenne',`${plural(low5.length,'zone')} sous l’objectif 5S : ${low5.slice(0,4).map(z=>`${z.z} (${fmtNum(z.s)} %)`).join(', ')}.`,'Traiter les écarts relevés et programmer un audit de suivi.');
  if(drop.length)add('x-5s-drop',drop.map(z=>z.last.id),'Production','Basse',`Baisse de plus de 10 points en 5S : ${drop.map(z=>z.z).slice(0,4).join(', ')}.`,'Vérifier la tenue des standards (étape Respecter).');
  const staleIdeas=db.ideas.filter(r=>(r.status||'Proposée')==='Proposée'&&isISO(r.date)&&daysFromToday(r.date)<=-30);
  if(staleIdeas.length)add('x-ideas',staleIdeas.map(r=>r.id),'Black Belt','Moyenne',`${plural(staleIdeas.length,'idée')} sans réponse depuis plus de 30 jours.`,'Répondre à chaque émetteur : lancer en Plan ou refuser en expliquant pourquoi.');
  const lateIdeas=db.ideas.filter(r=>OPEN_EXTRA.ideas(r)&&isISO(r.due)&&daysFromToday(r.due)<0);
  if(lateIdeas.length)add('x-ideas-late',lateIdeas.map(r=>r.id),'Black Belt','Basse',`${plural(lateIdeas.length,'idée')} en retard sur son échéance.`,'Faire le point avec le pilote.');
  const rcaStale=db.rca.filter(r=>OPEN_EXTRA.rca(r)&&r.created&&(Date.now()-Date.parse(r.created))/dayMs>30);
  if(rcaStale.length)add('x-rca',rcaStale.map(r=>r.id),'Qualité','Moyenne',`${plural(rcaStale.length,'analyse de causes')} ouverte${rcaStale.length>1?'s':''} depuis plus de 30 jours.`,'Conclure la cause racine ou escalader en revue.',rcaStale[0].ref||'');
  const rcaNoCheck=db.rca.filter(r=>r.status==='Efficacité vérifiée'&&!r.check);
  if(rcaNoCheck.length)add('x-rca-chk',rcaNoCheck.map(r=>r.id),'Qualité','Moyenne',`${plural(rcaNoCheck.length,'analyse')} déclarée${rcaNoCheck.length>1?'s':''} efficace${rcaNoCheck.length>1?'s':''} sans preuve.`,'Documenter la vérification de l’efficacité (données, date, responsable).');
  const recurring=Object.entries(db.checks.reduce((m,r)=>{m[r.defect]=(m[r.defect]||0)+(parseNum(r.qty)||0);return m},{})).sort((a,b)=>b[1]-a[1])[0];
  if(recurring&&recurring[1]>=10&&!db.rca.some(r=>OPEN_EXTRA.rca(r)&&String(r.title).toLowerCase().includes(String(recurring[0]).toLowerCase())))add('x-check',[recurring[0],String(recurring[1])],'Black Belt','Moyenne',`Défaut « ${recurring[0]} » : ${recurring[1]} pièces relevées, en tête du Pareto, sans analyse ouverte.`,'Ouvrir une analyse de causes (QQOQCP, Ishikawa 6M, 5 Pourquoi).');
}

const srBox=$('#srBox'),q=$('#q');
function search(term){
  term=term.trim().toLowerCase();
  if(term.length<2){srBox.hidden=true;return}
  const hits=[];
  for(const c of COLLS)for(const r of db[c]){if(Object.values(r).some(v=>String(v??'').toLowerCase().includes(term)))hits.push([c,r]);if(hits.length>=40)break}
  srBox.innerHTML=hits.length?hits.map(([c,r])=>`<button type="button" role="option" data-act="sr-go" data-coll="${c}" data-id="${esc(r.id)}"><b>${esc(r[SCHEMA[c].tk]||r.ref||'Fiche')}</b><small>${esc(VIEWS[SCHEMA[c].view].t)} · ${esc(COLL_LABEL[c])}${r.ref?' · '+esc(r.ref):''}${r.status?' · '+esc(r.status):''}</small></button>`).join(''):`<div class="empty">Aucune fiche ne contient « ${esc(term)} ».</div>`;
  srBox.hidden=false;
}
q.addEventListener('input',()=>search(q.value));
q.addEventListener('keydown',e=>{if(e.key==='Escape'){q.value='';srBox.hidden=true}if(e.key==='ArrowDown'){e.preventDefault();srBox.querySelector('button')?.focus()}});
srBox.addEventListener('keydown',e=>{const b=[...srBox.querySelectorAll('button')],i=b.indexOf(document.activeElement);if(e.key==='ArrowDown'){e.preventDefault();b[Math.min(i+1,b.length-1)]?.focus()}if(e.key==='ArrowUp'){e.preventDefault();i<=0?q.focus():b[i-1].focus()}if(e.key==='Escape'){srBox.hidden=true;q.focus()}});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))srBox.hidden=true});

document.addEventListener('click',async e=>{

  const {act,coll,id,view}=t.dataset;
  if(t.hasAttribute('data-write')&&isRO()){toast('Rôle en lecture seule.');return}
  switch(act){
    case 'nav':go(view);break;
    case 'menu':{const o=!rail.classList.contains('open');rail.classList.toggle('open',o);scrim.classList.toggle('open',o);t.setAttribute('aria-expanded',String(o));if(o)rail.querySelector('button')?.focus();break}
    case 'new':openForm(coll,null,t.dataset.preAi?{decisions:('[Projet rédigé par IA, à relire et valider]\n'+aiText).slice(0,4900),date:todayISO()}:{});break;
    case 'edit':openForm(coll,id);break;
    case 'del':del(coll,id);break;
    case 'csv':exportCSV(coll);break;
    case 'csv-log':exportLog();break;
    case 'export':exportJSON();break;
    case 'import':$('#file').click();break;
    case 'print':window.print();break;
    case 'trace':traceRef=t.dataset.ref;go('trace');break;
    case 'sr-go':srBox.hidden=true;q.value='';go(SCHEMA[coll].view);openForm(coll,id);break;
    case 'close-action':{const r=db.actions.find(x=>x.id===id);if(r){r.status='Close – efficacité à vérifier';r.updated=nowISO();log('Clôture','actions',r,'Efficacité à vérifier');persist();render();toast('Action close : vérifie son efficacité.')}break}
    case 'ack':{db.approvals[t.dataset.key]={at:nowISO()};const f=analyse().find(x=>x.key===t.dataset.key);log('Prise en compte','',null,f?`${f.agent} : ${f.finding}`:t.dataset.key);persist();render();toast('Recommandation prise en compte.');break}
    case 'to-action':{const f=analyse().find(x=>x.key===t.dataset.key);if(f)openForm('actions',null,{title:f.action.slice(0,300),ref:f.ref||'',priority:f.prio==='Haute'?'Haute':'Normale',evidence:'Constat : '+f.finding});break}
    case 'run':{const f=analyse();db.lastRun={at:nowISO()};log('Analyse des agents','',null,`${f.length} recommandation(s), dont ${f.filter(x=>x.prio==='Haute').length} haute(s)`);persist();render();toast(`${plural(f.length,'recommandation')} consignée${f.length>1?'s':''} au journal.`);break}
    case 'test':testLink(id);break;
    case 'ai':runAI();break;
    case 'pick':sel[t.dataset.kind]=id;render();break;
    case 'rca-from':{const r=db[coll]?.find(x=>x.id===id);if(r)openForm('rca',null,{ref:r.ref||'',title:String(r.title||'').slice(0,300),q_what:String(r.title||'').slice(0,300),q_when:fmtDate(r.detected||r.date||''),q_who:String(r.source||r.customer||'').slice(0,300),status:ST.rca[0]},{after:x=>{sel.rca=x.id;setTimeout(()=>go('rca'),0)}});break}
    case 'rca-action':{const r=db.rca.find(x=>x.id===id);if(r)openForm('actions',null,{title:String(r.action||'').slice(0,300),ref:r.ref||'',priority:'Haute',evidence:`Origine : analyse de causes « ${r.title} ». Cause racine : ${r.root||'à confirmer'}. Vérification prévue : ${r.check||'à définir'}.`});break}
    case 'idea-next':{const r=db.ideas.find(x=>x.id===id);if(!r)break;const flow=['Proposée','Plan','Do','Check','Act – standardisée'],i=flow.indexOf(r.status||'Proposée'),nx=i<0?null:flow[i+1];if(!nx)break;if(nx==='Act – standardisée'&&!r.result){toast('Renseigne le résultat mesuré avant de standardiser.');openForm('ideas',r.id);break}r.status=nx;r.updated=nowISO();log('Modification','ideas',r,'Étape PDCA : '+nx);persist();render();toast('Étape : '+nx);break}
    case 'ai-run':aiRunAgent(t.dataset.agent);break;
    case 'ai-decide':aiDecide(t.dataset.run,t.dataset.prop,t.dataset.verdict);break;
    case 'ai-decision':aiDecisionForm();break;
    case 'ai-key':vaultAction('key',id);break;
    case 'ai-key-del':vaultAction('key-del',id);break;
    case 'ai-vault-create':vaultAction('create');break;
    case 'ai-vault-unlock':vaultAction('unlock');break;
    case 'ai-vault-lock':vaultAction('lock');break;
    case 'ai-vault-forget':vaultAction('forget');break;
    case 'ai-prov-up':{if(db.meta.role!=='Directeur'){toast('Réservé au rôle Directeur.');break}const P=db.ai.providers,i=P.findIndex(p=>p.id===id);if(i>0){[P[i-1],P[i]]=[P[i],P[i-1]];log('Paramètre IA','',null,`Ordre de repli : ${P.map(p=>PROV[p.id].label).join(' > ')}`);persist();render()}break}
    case 'ai-req-add':aiReqAdd();break;
    case 'ai-csv':aiRegistryCSV();break;
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset?.tool){tool[t.dataset.tool]=t.value;render();return}
  if(t.id==='scData'){if(isRO())return;db.meta.scatter=t.value.slice(0,20000);persist();render();return}
  if(t.dataset?.target){
    if(!['Directeur','Qualité'].includes(db.meta.role)||isRO()){toast('Seuils réservés aux rôles Directeur et Qualité.');render();return}
    const k=t.dataset.target,v=parseNum(t.value);if(v===null||v<0){toast('Valeur invalide.');render();return}
    const old=db.meta.targets[k];db.meta.targets[k]=v;memo.clear();log('Seuil modifié','',null,`${k} : ${old} → ${v}`);persist();render();toast('Seuil enregistré.');
  }
});
let msaTimer=null;
document.addEventListener('input',e=>{
  const c=e.target.closest?.('[data-msa]');if(!c)return;
  const r=current$('msa',db.msa);if(!r||isRO())return;
  const v=c.value.trim(),x=parseVals(v),ok=v===''||(x.length===1&&isFinite(x[0]));
  c.classList.toggle('bad',!ok);c.setAttribute('aria-invalid',String(!ok));if(!ok)return;
  const [o,p,j]=c.dataset.msa.split('.').map(Number),g=msaGrid(r);g[o][p][j]=v===''?null:x[0];
  r.grid=JSON.stringify(g);r.updated=nowISO();
  const out=$('#msaOut');if(out)out.innerHTML=msaOutHTML(r);
  clearTimeout(msaTimer);msaTimer=setTimeout(()=>{const last=db.auditLog.at(-1);if(!(last&&last.id===r.id&&last.action==='Saisie des mesures'&&Date.now()-Date.parse(last.at)<300000))log('Saisie des mesures','msa',r,`${msaCalc(r).filled} mesures saisies`);persist();renderNav()},500);
});
document.addEventListener('paste',e=>{
  const c=e.target.closest?.('[data-msa]');if(!c||isRO())return;
  const txt=e.clipboardData?.getData('text')||'';if(!/[\t\n]/.test(txt.trim()))return;
  e.preventDefault();
  const r=current$('msa',db.msa);if(!r)return;
  const {k,n,t}=msaDims(r),g=msaGrid(r),[o0,p0,j0]=c.dataset.msa.split('.').map(Number),col0=o0*t+j0;let cnt=0,bad=0;
  txt.replace(/\r/g,'').split('\n').filter(l=>l.trim()!=='').forEach((line,ri)=>{const p=p0+ri;if(p>=n)return;line.split('\t').forEach((cell,ci)=>{const col=col0+ci;if(col>=k*t||!cell.trim())return;const x=parseVals(cell.trim());if(x.length===1&&isFinite(x[0])){g[Math.floor(col/t)][p][col%t]=x[0];cnt++}else bad++})});
  r.grid=JSON.stringify(g);r.updated=nowISO();log('Saisie des mesures','msa',r,`${cnt} valeur(s) collée(s)`);persist();render();
  toast(`${cnt} valeur${cnt>1?'s':''} collée${cnt>1?'s':''}${bad?`, ${bad} ignorée${bad>1?'s':''} (non numérique)`:''}.`);
});
document.addEventListener('input',e=>{if(e.target.id==='traceIn'){traceRef=e.target.value;const o=$('#traceOut');if(o)o.innerHTML=traceHTML()}});
$$('.role-sel').forEach(s=>s.addEventListener('change',e=>{const old=db.meta.role;db.meta.role=e.target.value;log('Changement de rôle','',null,`${old} → ${e.target.value}`);persist();render();toast(isRO()?'Lecture seule : les modifications sont désactivées.':'Rôle local : '+e.target.value)}));
window.addEventListener('offline',()=>toast('Hors ligne : les données restent disponibles localement.'));
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(VIEWS[h]&&h!==current)go(h)});

/* ───────── Démarrage ───────── */
(async function init(){
  await Store.init();
  await Vault.init();
  let loaded=false;
  try{const raw=await Store.get('db');if(raw){db=normalize(JSON.parse(raw));delete db._count;const src=JSON.parse(raw);db.lastRun=src.lastRun||null;db.meta.savedAt=src.meta?.savedAt||null;loaded=true}}catch{toast('Données locales illisibles : démarrage à vide. Importe ta dernière sauvegarde.')}
  if(!loaded){
    try{const legacy=localStorage.getItem('mecaria-real-v1');if(legacy){db=normalize(JSON.parse(legacy));delete db._count;const role=localStorage.getItem('mecaria-role');if(role)db.meta.role=role;log('Migration',null,null,'Reprise des données de la version précédente');persist();toast('Données de la version précédente reprises.')}}catch{}
  }
  const h=location.hash.slice(1);if(VIEWS[h])current=h;
  render(false);
  if(window.claude&&typeof window.claude.use==='function'){
    window.claude.use('downloads').then(n=>{DL=n}).catch(()=>{});
    window.claude.use('sample').then(n=>{if(n){AI=n;if(['review','agents','aigov'].includes(current))render()}}).catch(()=>{});
  }
})();
</script>
